<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ビジネス敬語シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 全画面の3Dステージ＋下から出る選択パネル。電話の場面は右上に相手側の小窓。単一の明るい世界観（テーマ切替なし） */
:root{
  --sky:#cfe6f2; --ink:#2d2a3e; --muted:#6f6a80; --paper:#fffaf2; --line:#eadfcd;
  --accent:#ff7a59; --accent-ink:#ffffff; --ok:#1f9d63; --ok-bg:#e3f6ec; --ng:#e0484e; --ng-bg:#fde8e8;
  --font:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.hud{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{pointer-events:auto;background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:52vw}
.meter{flex:1;max-width:220px;margin-left:auto;background:var(--paper);border-radius:999px;padding:5px 10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08);min-width:84px}
.meter .bar{flex:1;height:10px;border-radius:99px;background:#efe6d6;overflow:hidden}
.meter .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#ffb35c,var(--accent));border-radius:99px;transition:width .5s}
.iconbtn{border:0;background:var(--paper);border-radius:999px;width:34px;height:34px;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.08);pointer-events:auto;flex:none}

.pipframe{position:fixed;border:3px solid #fff;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:none}
.pipframe span{position:absolute;left:6px;top:-12px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;background:var(--ink);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}

.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border-radius:14px;padding:7px 11px;font-size:14px;line-height:1.45;max-width:min(250px,64vw);box-shadow:0 3px 10px rgba(0,0,0,.14);font-weight:700}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble .who{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.bubble.tel{background:#2d2a3e;color:#fff}.bubble.tel::after{border-top-color:#2d2a3e}.bubble.tel .who{color:#cfc8e8}
.emo{position:absolute;transform:translate(-50%,-100%);font-size:34px;animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-60%) scale(.4)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}

.panel{position:fixed;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .3s ease}
.panel.show{transform:none}
.panel .in{max-width:640px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.12);max-height:62vh;overflow:auto}
.q{font-weight:800;font-size:16px;line-height:1.5;margin:2px 0 10px;text-wrap:balance}
.q small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:700;line-height:1.5}
.opt:active{transform:translateY(2px)}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;background:var(--sky);display:grid;place-items:center;font-size:12px;font-weight:800}
.res h3{margin:0 0 4px;font-size:20px}
.res.ok h3{color:var(--ok)} .res.ng h3{color:var(--ng)}
.res .model{background:var(--ok-bg);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;margin:6px 0}
.res p{margin:6px 0 12px;font-size:14px;line-height:1.65}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:rgba(45,42,62,.75);color:#fff;font-size:12px;border-radius:999px;padding:5px 12px;pointer-events:none;transition:opacity .3s}
.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:800;border-radius:999px;padding:6px 16px;font-size:14px;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.caption{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(45,42,62,.88);color:#fff;font-weight:800;border-radius:16px;padding:12px 20px;font-size:17px;text-align:center;pointer-events:none;transition:opacity .4s;max-width:86vw;line-height:1.5}

.screen{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(207,230,242,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:100%;max-width:460px;background:var(--paper);border-radius:24px;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.15);max-height:calc(100% - 20px);overflow:auto}
.card h1{font-size:25px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.card p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.6}
.chapters{display:grid;gap:8px;margin-bottom:6px}
.chap{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:16px;padding:10px 12px}
.chap:active{transform:translateY(2px)}
.chap b{display:block;font-size:15px}
.chap small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.chap .no{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-weight:800}
.chap .rk{margin-left:auto;flex:none;font-weight:800;color:var(--accent);font-size:20px;min-width:22px;text-align:center}
.rank{font-size:64px;font-weight:800;color:var(--accent);line-height:1;margin:6px 0}
.log{list-style:none;padding:0;margin:10px 0 16px;display:grid;gap:6px;font-size:14px}
.log li{display:flex;gap:8px;background:#fff;border-radius:10px;padding:6px 10px}
.stack{display:grid;gap:8px}
/* ふりがな（rt を隠すだけで切り替え） */
ruby{ruby-position:over} rt{font-size:.5em;font-weight:500;letter-spacing:0;opacity:.85}
body.nofuri rt{display:none}
.bubble{line-height:1.75}
.toggles{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:4px 11px;font-size:12.5px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hudbtn{border:0;background:var(--paper);border-radius:999px;height:34px;min-width:34px;padding:0 9px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08);pointer-events:auto;flex:none}
.hudbtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.card.wide{max-width:680px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:4px;background:#f1e8da;border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:7px 8px;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.small{font-size:12.5px!important;color:var(--muted)}
.tabbody h2{font-size:17px;margin:20px 0 8px;text-wrap:balance}
.tabbody section:first-child h2{margin-top:4px}
.txt{font-size:14px;line-height:1.75}
.t-son{--c:#d23b62;--cb:#ffe3ea}.t-ken{--c:#2a6fcc;--cb:#e1eeff}.t-tei{--c:#178a66;--cb:#dcf5ec}
.badge{display:inline-block;padding:0 9px;border-radius:999px;background:var(--cb);color:var(--c);font-weight:800;font-size:13px;line-height:1.9}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcard{background:var(--cb);border-radius:16px;padding:12px 10px;text-align:center;min-width:0}
.tcard .arrow{font-size:24px;line-height:1}.tcard>b{color:var(--c);display:block;font-size:17px;margin-top:4px}.tcard p b{color:var(--c)}
.tcard small{color:var(--muted);font-size:11px;font-weight:700}
.tcard p{margin:6px 0 0;font-size:12.5px;line-height:1.6;text-align:left}
.tcard .ex{background:#fff;border-radius:10px;padding:6px 8px;font-weight:700}
.say{border:0;background:none;padding:0 2px;font-size:13px}
.flow{margin:0;padding-left:20px;font-size:14px;line-height:2}
.exlist{display:grid;gap:6px;margin-top:8px}
.exlist div{background:#fff;border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-weight:700;font-size:14.5px}
.exlist small{width:100%;color:var(--muted);font-weight:700;font-size:11.5px}
.pats{display:grid;gap:6px}
.pats div{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;background:var(--cb);border-radius:12px;padding:7px 10px}
.pats b{font-size:14.5px}.pats div>span:last-child{grid-column:2;font-size:13px;color:var(--muted)}
.mis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mis div{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;display:flex;flex-direction:column}
.mis .x{color:var(--ng);font-weight:800;text-decoration:line-through;text-decoration-thickness:1px}.mis .o{color:var(--ok);font-weight:800}.mis small{color:var(--muted);font-size:11.5px}
.names{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
.names th,.names td{background:#fff;padding:6px 8px;text-align:left;vertical-align:top}
.names thead th{background:none;color:var(--muted);font-size:12px;padding-bottom:0}
.names tbody th{border-radius:10px 0 0 10px}.names td:last-child{border-radius:0 10px 10px 0}
.names th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.search{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;margin-bottom:10px}
.vrow{background:#fff;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.vh{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:none;border:0;text-align:left}
.vh .base{font-size:19px;font-weight:800}.mean{color:var(--muted);font-size:13px}
.vh .chev{margin-left:auto;color:var(--muted);transition:transform .2s}.vrow.open .chev{transform:rotate(90deg)}
.vbody{display:none;padding:0 10px 10px;gap:6px}.vrow.open .vbody{display:grid}
.vcell{border-radius:12px;padding:7px 9px;background:var(--cb);display:flex;gap:8px;align-items:flex-start}
.vcell .lab{flex:none;color:var(--c);font-weight:800;font-size:13px;width:66px;line-height:1.5}
.vcell .lab small{display:block;font-size:10.5px;color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.word{background:#fff;border:0;border-radius:10px;padding:2px 9px;font-weight:700;font-size:15px;line-height:1.9}
.word i{font-style:normal;font-size:11px;opacity:.6}
.note{font-size:12.5px;color:var(--muted);margin:2px}
.pq{text-align:center;margin:6px 0 14px}
.pq .big{display:inline-block;font-size:34px;font-weight:800;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 16px}
.pq .mean{display:block;margin-top:4px}.pto{margin-top:8px;font-weight:800;font-size:16px}.pto small{color:var(--muted);font-size:12px}
.opt.sel-ok{background:var(--ok-bg);border-color:var(--ok)}.opt.sel-ng{background:var(--ng-bg);border-color:var(--ng)}.opt.dim{opacity:.45}
.pres{margin-top:12px;border-radius:14px;padding:10px 12px;display:grid;gap:5px;font-size:14px}
.pres.ok{background:var(--ok-bg)}.pres.ng{background:var(--ng-bg)}.pres>b{font-size:17px}.pres.ok>b{color:var(--ok)}.pres.ng>b{color:var(--ng)}
.pres .btn{margin-top:6px}
@media (max-width:480px){.trio{grid-template-columns:1fr}.mis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.panel,.meter .bar i{transition:none}.emo{animation-duration:.01s}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="pipframe" id="pipFrame" hidden><span id="pipLabel">📞 通話中</span></div>
<div id="overlay"></div>
<div class="hud">
  <span class="pill" id="stepPill">ビジネス敬語シミュレーター</span>
  <div class="meter"><span id="meterLabel">印象</span><span class="bar"><i id="meterBar"></i></span><span id="meterNum">50</span></div>
  <button class="hudbtn" id="furiBtn" aria-pressed="true" aria-label="ふりがな / Furigana">ふ</button><button class="hudbtn" id="langBtn" aria-label="Language">EN</button><button class="iconbtn" id="soundBtn" aria-label="音声のオンオフ">🔊</button>
</div>
<div class="banner" id="banner" style="opacity:0">お手本</div>
<div class="caption" id="captionEl" style="opacity:0"></div>
<div class="hint" id="hint" style="opacity:0"></div>
<div class="panel" id="panel"><div class="in" id="panelIn"></div></div>
<div class="screen" id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   3D の土台
   ========================================================= */
const stage=document.getElementById('stage'), overlay=document.getElementById('overlay');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#cfe6f2'); scene.fog=new THREE.Fog('#cfe6f2',16,34);
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
const camLook=new THREE.Vector3(0,1,0);
const cam2=new THREE.PerspectiveCamera(38,1.33,0.1,40);
const pipLook=new THREE.Vector3();
camera.position.set(1,5.5,10);
const portrait=()=>innerWidth<innerHeight;
function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h);
  camera.aspect=w/h; camera.fov=portrait()?62:42;
  // 下の選択パネルの分だけ、被写体を画面の上寄りに置く
  camera.setViewOffset(w,h,0,h*(portrait()?0.17:0.12),w,h);
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

scene.add(new THREE.HemisphereLight('#ffffff','#bba98c',0.85));
const sun=new THREE.DirectionalLight('#fff3e0',0.75); sun.position.set(5,12,8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:60});
sun.target.position.set(2,0,4); scene.add(sun.target); scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.85});
function box(w,h,d,c,x=0,y=0,z=0,parent=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function cyl(rt,rb,h,c,x,y,z,seg=7,parent=scene){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c)); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function plant(x,z,s=1){ cyl(0.22*s,0.17*s,0.45*s,'#c9764b',x,0.22*s,z); const l=new THREE.Mesh(new THREE.IcosahedronGeometry(0.42*s,0),mat('#5fa36a'));
  l.position.set(x,0.85*s,z); l.castShadow=true; scene.add(l); const l2=l.clone(); l2.scale.setScalar(.7); l2.position.y=1.25*s; scene.add(l2); }
function chair(x,z,ry,c='#5b6b8c'){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
  box(0.52,0.09,0.5,c,0,0.45,0,g); box(0.52,0.62,0.09,c,0,0.78,-0.22,g);
  [[-0.22,-0.2],[0.22,-0.2],[-0.22,0.2],[0.22,0.2]].forEach(([a,b])=>box(0.05,0.42,0.05,'#444',a,0.21,b,g));
}
function desk(x,z,w=1.4,d=0.7){ box(w,0.06,d,'#efe9df',x,0.74,z); box(0.06,0.72,d-0.05,'#b9b2a6',x-w/2+0.05,0.36,z); box(0.06,0.72,d-0.05,'#b9b2a6',x+w/2-0.05,0.36,z); }

/* ---------- ゾーンA：受付と応接室（会社の看板は話ごとに差し替え） ---------- */
box(17,0.1,11.5,'#e9dcc6',0,-0.05,0);
box(17,3.2,0.15,'#f6efe4',0,1.6,-4.65);
box(0.15,3.2,7.4,'#f1e7d8',-7.6,1.6,-1.9);
box(0.15,3.2,2.4,'#f1e7d8',-7.6,1.6,4.3);
box(0.15,0.9,1.2,'#f1e7d8',-7.6,2.75,2.5);
box(0.2,2.35,0.1,'#9b7653',-7.6,1.17,1.88); box(0.2,2.35,0.1,'#9b7653',-7.6,1.17,3.12);
box(3.2,1.5,0.06,'#bfe3f5',2.5,1.85,-4.55); box(3.4,0.08,0.12,'#ffffff',2.5,1.08,-4.52); box(0.06,1.5,0.08,'#ffffff',2.5,1.85,-4.5);
box(2.6,1.05,0.6,'#8a6a4f',-3.5,0.525,-0.45); box(2.8,0.06,0.72,'#f6f2ea',-3.5,1.08,-0.45);
box(0.3,0.22,0.2,'#d8d2c6',-2.6,1.22,-0.5);
const signCanvas=document.createElement('canvas'); signCanvas.width=512; signCanvas.height=128;
const signTex=new THREE.CanvasTexture(signCanvas);
{ const m=new THREE.Mesh(new THREE.PlaneGeometry(2.6,0.65),new THREE.MeshBasicMaterial({map:signTex})); m.position.set(-3.5,2.35,-4.56); scene.add(m); }
function setSign(main,sub,color='#2f3a56'){
  const g=signCanvas.getContext('2d'); g.fillStyle=color; g.fillRect(0,0,512,128); g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
  g.font='bold 54px sans-serif'; g.fillText(main,256,58); g.font='22px sans-serif'; g.fillText(sub,256,104); signTex.needsUpdate=true;
}
plant(-0.8,-3.9); plant(6.2,-3.9); plant(-6.8,-3.9);

let TW=[];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tw(obj,key,to,ms=500){
  TW=TW.filter(x=>!(x.obj===obj&&x.key===key));
  return new Promise(r=>TW.push({obj,key,from:obj[key],to,ms:Math.max(ms,1),t0:performance.now(),r}));
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const ARM={down:[0,0.05,0], fwd:[-0.5,-0.22,-1.0], phone:[-0.75,-0.12,-2.45], look:[-0.35,-0.1,-1.35]};
function armTo(p,side,name,ms=420){
  const [x,z,e]=ARM[name], a=side==='R'?p.u.armR:p.u.armL, el=side==='R'?p.u.elR:p.u.elL, s=side==='R'?-1:1;
  return all(tw(a.rotation,'x',x,ms),tw(a.rotation,'z',z*s,ms),tw(el.rotation,'x',e,ms));
}
function armSet(p,side,name){ const [x,z,e]=ARM[name], s=side==='R'?-1:1;
  (side==='R'?p.u.armR:p.u.armL).rotation.set(x,0,z*s); (side==='R'?p.u.elR:p.u.elL).rotation.set(e,0,0); }
const armsFwd=(p,both=true)=>all(armTo(p,'R','fwd'),both?armTo(p,'L','fwd'):0);
const armsDown=p=>all(armTo(p,'R','down'),armTo(p,'L','down'));
async function phoneUp(p){ p.u.phone.visible=true; await armTo(p,'R','phone'); }

function turnTo(p,ry,ms=320){ const c=p.rotation.y; const d=((ry-c+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; return tw(p.rotation,'y',c+d,ms); }
function face(p,q){ return turnTo(p,Math.atan2(q.position.x-p.position.x,q.position.z-p.position.z)); }
async function walk(p,x,z,speed=1.7){
  const dx=x-p.position.x, dz=z-p.position.z, dist=Math.hypot(dx,dz); if(dist<0.01) return;
  await turnTo(p,Math.atan2(dx,dz)); p.walking=true;
  const ms=dist/speed*1000; await all(tw(p.position,'x',x,ms),tw(p.position,'z',z,ms));
  p.walking=false; p.u.thL.rotation.x=p.u.thR.rotation.x=0; p.u.hips.position.y=0.85;
  if(!p.u.phone.visible){ p.u.armL.rotation.x=0; p.u.armR.rotation.x=0; }
}

function pose(p,o){
  if(!o){ p.visible=false; p.position.set(0,0,-30); return; }
  const {x,z,ry=0,sit:s=false,arms='down'}=o;
  p.visible=true; p.walking=false; p.position.set(x,0,z); p.rotation.set(0,ry,0);
  const u=p.u; u.hips.position.y=s?0.52:0.85;
  u.thL.rotation.set(s?-1.57:0,0,0); u.thR.rotation.set(s?-1.57:0,0,0);
  u.knL.rotation.set(s?1.57:0,0,0); u.knR.rotation.set(s?1.57:0,0,0);
  u.torso.rotation.set(0,0,0); u.head.rotation.set(0,0,0);
  armSet(p,'L',arms==='fwd'?'fwd':'down'); armSet(p,'R',arms);
  u.phone.visible=arms==='phone'||arms==='look';
  if(arms==='look') u.head.rotation.x=0.4;
}

function camTo(name,ms=1100){
  const [p,l]=cam(name);
  return all(tw(camera.position,'x',p[0],ms),tw(camera.position,'y',p[1],ms),tw(camera.position,'z',p[2],ms),
    tw(camLook,'x',l[0],ms),tw(camLook,'y',l[1],ms),tw(camLook,'z',l[2],ms));
}
function camSet(name){ const [p,l]=cam(name); camera.position.set(...p); camLook.set(...l); }
let pip=null;
const pipFrame=document.getElementById('pipFrame'), pipLabel=document.getElementById('pipLabel');
function setPip(key){
  pip=key?{actor:ACTORS[key],key}:null; pipFrame.hidden=!pip;
  if(!pip) return;
  const [p,l,label,labelEn]=PIPS[key]; cam2.position.set(...p); pipLook.set(...l); pipLabel.innerHTML='📞 '+LR(label,labelEn);
}
function pipRect(){
  const w=innerWidth, pw=Math.round(Math.min(w*0.44,260)), ph=Math.round(pw*0.72);
  return {x:w-pw-12,y:62,w:pw,h:ph};
}

/* =========================================================
   吹き出し・音声
   ========================================================= */
let soundOn=true, VOICE=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); VOICE=vs.find(v=>/^ja/i.test(v.lang))||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function tts(text,pitch){
  return new Promise(res=>{
    if(!soundOn||!('speechSynthesis' in window)) return res();
    try{ const u=new SpeechSynthesisUtterance(text.replace(/[（(].*?[）)]/g,'')); u.lang='ja-JP'; if(VOICE) u.voice=VOICE; u.pitch=pitch; u.rate=1.05;
      u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); }catch(e){ res(); }
  });
}
const tags=new Map();
function tag(p,el){ overlay.appendChild(el); tags.set(el,p); return el; }
function untag(el){ tags.delete(el); el.remove(); }
let skipper=null;
const hintEl=document.getElementById('hint');
async function say(p,text,who){
  const el=document.createElement('div'); el.className='bubble'+(pip&&p===pip.actor?' tel':'');
  const label=Array.isArray(who)?LR(who[0],who[1]):LR(p.name,p.nameEn);
  el.innerHTML=`<span class="who">${label}</span>${rb(text)}`; el.dataset.y='0.5'; tag(p,el);
  hintEl.style.opacity=1;
  const skip=new Promise(r=>skipper=r);
  await Promise.race([all(tts(text,p.pitch),wait(Math.max(1100,text.length*105))),wait(text.length*260+2500),skip]);
  try{ speechSynthesis.cancel(); }catch(e){}
  skipper=null; hintEl.style.opacity=0; untag(el);
}
stage.addEventListener('pointerdown',()=>{ if(skipper) skipper(); });
function emote(p,e){ const el=document.createElement('div'); el.className='emo'; el.textContent=e; el.dataset.y='0.42'; tag(p,el); setTimeout(()=>untag(el),1300); }
const captionEl=document.getElementById('captionEl');
async function caption(ja,en,ms=1800){ captionEl.innerHTML=LR(ja,en); captionEl.style.opacity=1; await wait(ms); captionEl.style.opacity=0; await wait(300); }
const v3=new THREE.Vector3();
function placeTags(){
  const r=pip&&pipRect();
  for(const [el,p] of tags){
    if(!p.visible){ el.style.display='none'; continue; }
    p.u.head.getWorldPosition(v3); v3.y+=+el.dataset.y;
    let x,y;
    if(pip&&p===pip.actor){ v3.y-=0.2; v3.project(cam2); x=r.x+(v3.x+1)/2*r.w; y=r.y+(1-v3.y)/2*r.h; y=Math.max(y,r.y+r.h*0.35); x=Math.min(x,innerWidth-120); }
    else { v3.project(camera); if(v3.z>1){ el.style.display='none'; continue; } x=(v3.x+1)/2*innerWidth; y=(1-v3.y)/2*innerHeight; }
    el.style.display=''; el.style.left=x+'px'; el.style.top=y+'px';
  }
}

/* =========================================================
   ループ
   ========================================================= */
function loop(now){
  for(const t of TW.slice()){
    const k=Math.min(1,(now-t.t0)/t.ms); t.obj[t.key]=t.from+(t.to-t.from)*ease(k);
    if(k>=1){ TW.splice(TW.indexOf(t),1); t.r(); }
  }
  const s=now/1000;
  for(const p of Object.values(ACTORS)){
    if(p.walking){ const a=Math.sin(s*9)*0.45; p.u.thL.rotation.x=a; p.u.thR.rotation.x=-a; p.u.armL.rotation.x=-a*.5; if(!p.u.phone.visible) p.u.armR.rotation.x=a*.5; p.u.hips.position.y=0.85+Math.abs(Math.cos(s*9))*0.03; }
    const b=(s+p.blink)%4<0.12; p.u.eyes.forEach(e=>e.scale.y=b?0.15:1);
  }
  const w=innerWidth,h=innerHeight;
  camera.lookAt(camLook);
  renderer.setScissorTest(false); renderer.setViewport(0,0,w,h); renderer.render(scene,camera);
  if(pip){
    const r=pipRect(); cam2.aspect=r.w/r.h; cam2.updateProjectionMatrix(); cam2.lookAt(pipLook);
    renderer.setScissorTest(true); renderer.setScissor(r.x,h-r.y-r.h,r.w,r.h); renderer.setViewport(r.x,h-r.y-r.h,r.w,r.h);
    renderer.render(scene,cam2); renderer.setScissorTest(false);
    Object.assign(pipFrame.style,{left:(r.x-3)+'px',top:(r.y-3)+'px',width:r.w+'px',height:r.h+'px'});
  }
  placeTags(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

     why:'見たのは自分なので、謙譲語の<b>「拝見する」</b>。',

    {t:'「はい、ご覧になりました。」', act:async()=>{ await say(P,'はい、ご覧になりました。'); await nod(P); }, react:'ふふ、それだと私が見たみたいですね。',

 { title:'逆質問の敬語', titleEn:"Asking your own question", cam:'overS', npc:S,

 { title:'面談後のお礼', titleEn:"Thanking them at the end", cam:'side', npc:S,

 { title:'退出のあいさつ', titleEn:"Leaving the room", cam:'door', npc:S,

/* ---------------- 第2話 ---------------- */
{ id:'appo', no:2, title:'電話でアポ取り', titleEn:"Making an appointment by phone", sub:'学生の部屋から、企業見学の日程を決める', subEn:"Book a company visit from your room", sign:['株式会社ストレンジ','STRANGE Inc.'],

  },
  steps:[
 { title:'電話をかける前に', titleEn:"Before you call", cam:'room2', npc:null,
   state:{P:ROOM_P},
   q:'企業見学のアポを取る電話。どこで、どうかける？',
   qEn:"You are calling to book a company visit. Where and how do you call?",
   opts:[

     act:async()=>{ await walk(P,-1.05,14.9); await turnTo(P,R180); await nod(P); await walk(P,0,15.6); await turnTo(P,0); },
     why:'電話は<b>静かな場所</b>で、<b>伝えるべき要点を書いたメモ</b>を見ながら話します（資料より）。',
     whyEn:"Call from a <b>quiet place</b>, and look at a <b>memo of the key points</b> while you talk (from the handout)."},
    {t:'駅のホームで、歩きながらかける', tEn:"From a train platform, while walking",
     act:async()=>{ await phoneUp(P); await say(P,'（ガタンゴトン…プシュー）',['📢 駅の音',"📢 Station noise"]); await walk(P,1.6,15.6); await walk(P,-1.4,15.6); await walk(P,0,15.6); await turnTo(P,0); await phoneDown(P); },
     why:'騒がしい場所だと相手の声も自分の声も聞き取れません。静かな場所でかけましょう。',
     whyEn:"In a noisy place, neither of you can hear well. Call from somewhere quiet."},
    {t:'メモは用意せず、思いついたことをそのまま話す', tEn:"No memo. Just say whatever comes to mind",
     act:async()=>{ await nod(P); await say(P,'（なんとかなるでしょ…）',['あなたの心の声',"Your inner voice"]); },
     why:'緊張すると要点が抜けがち。日時・用件・候補日などをメモにして、見ながら話します。',
     whyEn:"When you are nervous, you forget things. Write down the purpose and candidate dates, and read from the memo."},
   ],
   after:async()=>{ await phoneUp(P); await say(P,'（プルルル…プルルル…）',['📞 呼び出し中',"📞 Ringing"]); pose(U,ph(RECEP_U)); setPip('U');
     await say(U,'お電話ありがとうございます。株式会社ストレンジでございます。'); } },

 { title:'名乗り方', titleEn:"Introducing yourself", cam:'room2', npc:U,
   state:{P:ph(ROOM_P),U:ph(RECEP_U),pip:'U'},
   q:'受付の方が電話に出た。最初になんと言う？',
   qEn:"The receptionist answers. What do you say first?",
   opts:[
    {t:'「お忙しいところ恐れ入ります。山形大学経済学部の田中と申します。」',ok:true,
     act:async()=>{ await say(P,'お忙しいところ恐れ入ります。山形大学経済学部の田中と申します。'); },
     why:'<b>自分から名乗り、挨拶する</b>のが基本。「お忙しいところ恐れ入ります」はクッション言葉（資料より）。',
     whyEn:"The basic rule: <b>give your name and greet them first</b>. お忙しいところ恐れ入ります is a cushion phrase (from the handout)."},
    {t:'「もしもし、田中ですけど。」',
     act:async()=>{ await say(P,'もしもし、田中ですけど。'); }, react:'…失礼ですが、どちらの田中様でしょうか？',
     why:'「もしもし」はビジネスの電話では使いません。所属（大学・学部）も名乗りましょう。',
     whyEn:"Do not use もしもし on business calls. Also say your university and faculty."},
    {t:'「あ、すみません、インターンの件なんですけど…」',
     act:async()=>{ await say(P,'あ、すみません、インターンの件なんですけど…'); }, react:'恐れ入りますが、お名前をお願いできますか？',
     why:'名乗らずに用件から話し始めるのは×。まず所属と名前です。',
     whyEn:"Do not start with your request before giving your name. Your school and name come first."},

 { title:'担当者を呼んでもらう', titleEn:"Asking for the person in charge", cam:'room2', npc:U,
   state:{P:ph(ROOM_P),U:ph(RECEP_U),pip:'U'},
   q:'人事部の鈴木様に代わってほしい。なんと言う？',

     whyEn:"Say <b>why you are calling</b> and <b>the person's department and name</b>. Use the respectful いらっしゃる for people on their side (from the handout)."},

     act:async()=>{ await say(P,'インターンの件で、鈴木さんはおりますか。'); },

    {t:'「鈴木様に代わっていただけますか？急いでいるので。」',

     why:'用件を言わずに急かすのは失礼。相手の会社の都合を優先しましょう。',

 { title:'担当者が不在のとき', titleEn:"When the person is out", cam:'room2', npc:U,

    {t:'「じゃあ、また電話します。」',

     why:'いつかけ直せばいいか分からず、また不在になるかも。戻る時間を聞きましょう。',

 { title:'用件の前に', titleEn:"Before your request", cam:'room2', npc:S,

   q:'鈴木様につながった！用件を話す前に…',

   opts:[
    {t:'「山形大学の田中と申します。今、お時間よろしいでしょうか。」',ok:true,

     why:'担当者が変わったら、もう一度名乗ります。相手の都合も確認しましょう。',

     why:'「ひまですか」は失礼。「今、お時間よろしいでしょうか」で都合を確認します。',
     whyEn:"ひまですか (are you free with nothing to do?) is rude. Check with 今、お時間よろしいでしょうか."},

 { title:'希望日がダメだったら', titleEn:"If your date does not work", cam:'room2', npc:S,

y>","Keigo for 見た":"Keigo for <ruby>見<rt>み</rt></ruby>た","「会社案内は、もう見ていただけましたか？」と聞かれた。":"「<ruby>会社<rt>かいしゃ</rt></ruby><ruby>案内<rt>あんない</rt></ruby>は、もう<ruby>見<rt>み</rt></ruby>ていただけましたか？」と<ruby>聞<rt>き</rt></ruby>かれた。","You are asked「会社案内は、もう見ていただけましたか？」":"You are asked「<ruby>会社<rt>かいしゃ</rt></ruby><ruby>案内<rt>あんない</rt></ruby>は、もう<ruby>見<rt>み</rt></ruby>ていただけましたか？」","「はい、拝見しました。」":"「はい、<ruby>拝見<rt>はいけん</rt></ruby>しました。」","はい、拝見しました。":"はい、<ruby>拝見<rt>はいけん</rt></ruby>しました。","見たのは自分なので、謙譲語の<b>「拝見する」</b>。":"<ruby>見<rt>み</rt></ruby>たのは<ruby>自分<rt>じぶん</rt></ruby>なので、<ruby>謙譲語<rt>けんじょうご</rt></ruby>の<b>「<ruby>拝見<rt>はいけん</rt></ruby>する」</b>。","You are the one who looked, so use the humble <b>拝見する</b>.":"You are the one who looked, so use the humble <b><ruby>拝見<rt>はいけん</rt></ruby>する</b>.","「はい、ご覧になりました。」":"「はい、ご<ruby>覧<rt>らん</rt></ruby>になりました。」","はい、ご覧になりました。":"はい、ご<ruby>覧<rt>らん</rt></ruby>になりました。","ふふ、それだと私が見たみたいですね。":"ふふ、それだと<ruby>私<rt>わたし</rt></ruby>が<ruby>見<rt>み</rt></ruby>たみたいですね。","「ご覧になる」は相手の動作に使う尊敬語。自分には使いません。":"「ご<ruby>覧<rt>らん</rt></ruby>になる」は<ruby>相手<rt>あいて</rt></ruby>の<ruby>動作<rt>どうさ</rt></ruby>に<ruby>使<rt>つか</rt></ruby>う<ruby>尊敬語<rt>そんけいご</rt></ruby>。<ruby>自分<rt>じぶん</rt></ruby>には<ruby>使<rt>つか</rt></ruby>いません。","ご覧になる is respectful and is for the other person's action. Do not use it for yourself.":"ご<ruby>覧<rt>らん</rt></ruby>になる is respectful and is for the other person's action. Do not use it for yourself.","「はい、拝見されました。」":"「はい、<ruby>拝見<rt>はいけん</rt></ruby>されました。」","はい、拝見されました。":"はい、<ruby>拝見<rt>はいけん</rt></ruby>されました。","謙譲語「拝見する」に尊敬の「れる」が混ざった誤用です。":"<ruby>謙譲語<rt>けんじょうご</rt></ruby>「<ruby>拝見<rt>はいけん</rt></ruby>する」に<ruby>尊敬<rt>そんけい</rt></ruby>の「れる」が<ruby>混<rt>ま</rt></ruby>ざった<ruby>誤用<rt>ごよう</rt></ruby>です。","This mixes the humble 拝見する with the respectful れる. It is a mistake.":"This mixes the humble <ruby>拝見<rt>はいけん</rt></ruby>する with the respectful れる. It is a mistake.","ありがとうございます。では、何かご質問はありますか？":"ありがとうございます。では、<ruby>何<rt>なに</rt></ruby>かご<ruby>質問<rt>しつもん</rt></ruby>はありますか？", <rt>どうさ</rt></ruby>には×。","弊社 means your own company. お聞きになる is respectful, so it is wrong for your own action.":"<ruby>弊社<rt>へいしゃ</rt></ruby> means your own company. お<ruby>聞<rt>き</rt></ruby>きになる is respectful, so it is wrong for your own action.","「貴社の研修制度って、どんな感じっすか？」":"「<ruby>貴社<rt>きしゃ</rt></ruby>の<ruby>研修<rt>けんしゅう</rt></ruby><ruby>制度<rt>せいど</rt></ruby>って、どんな<ruby>感<rt>かん</rt></ruby>じっすか？」","貴社の研修制度って、どんな感じっすか？":"<ruby>貴社<rt>きしゃ</rt></ruby>の<ruby>研修<rt>けんしゅう</rt></ruby><ruby>制度<rt>せいど</rt></ruby>って、どんな<ruby>感<rt>かん</rt></ruby>じっすか？","話すときは「御社」。「〜っすか」は面接では避けましょう。":"<ruby>話<rt>はな</rt></ruby>すときは「<ruby>御社<rt>おんしゃ</rt></ruby>」。「〜っすか」は<ruby>面接<rt>めんせつ</rt></ruby>では<ruby>避<rt>さ</rt></ruby>けましょう。","When speaking, say 御社. Avoid 〜っすか in an interview.":"When speaking, say <ruby>御社<rt>おんしゃ</rt></ruby>. Avoid 〜っすか in an interview.","入社後の3か月間は、同期全員で研修を行っております。":"<ruby>入社<rt>にゅうしゃ</rt></ruby><ruby>後<rt>ご</rt></ruby>の3か<ruby>月<rt>げつ</rt></ruby><ruby>間<rt>かん</rt></ruby>は、<ruby>同期<rt>どうき</rt></ruby><ruby>全員<rt>ぜんいん</rt></ruby>で<ruby>研修<rt>けんしゅう</rt></ruby>を<ruby>行<rt>おこな</rt></ruby>っております。","本日の面談は以上です。ありがとうございました。":"<ruby>本日<rt>ほんじつ</rt></ruby>の<ruby>面談<rt>めんだん</rt></ruby>は<ruby>以上<rt>いじょう</rt></ruby>です。ありがとうございました。","面談後のお礼":"<ruby>面談<rt>めんだん</rt></ruby><ruby>後<rt>ご</rt></ruby>のお<ruby>礼<rt>れい</rt></ruby>","面談が終わった。どうする？":"<ruby>面談<rt>めんだん</rt></ruby>が<ruby>終<rt>お</rt></ruby>わった。どうする？","立ち上がって「本日はありがとうございました。」と言ってから、深くお辞儀":"<ruby>立<rt>た</rt></ruby>ち<ruby>上<rt>あ</rt></ruby>がって「<ruby>本日<rt>ほんじつ</rt></ruby>はありがとうございました。」と<ruby>言<rt>い</rt></ruby>ってから、<ruby>深<rt>ふか</rt></ruby>くお<ruby>辞儀<rt>じぎ</rt></ruby>","Stand up, say「本日はありがとうございました。」, then bow deeply":"Stand up, say「<ruby>本日<rt>ほんじつ</rt></ruby>はありがとうございました。」, then bow deeply","本日はありがとうございました。":"<ruby>本日<rt>ほんじつ</rt></ruby>はありがとうございました。","面談後は<b>一度立って</b>お礼を言い、それからお辞儀します。":"<ruby>面談<rt>めんだん</rt></ruby><ruby>後<rt>ご</rt></ruby>は<b><ruby>一度<rt>いちど</rt></ruby><ruby>立<rt>た</rt></ruby>って</b>お<ruby>礼<rt>れい</rt></ruby>を<ruby>言<rt>い</rt></ruby>い、それからお<ruby>辞儀<rt>じぎ</rt></ruby>します。","座ったまま「ご苦労さまでした」":"<ruby>座<rt>すわ</rt></ruby>ったまま「ご<ruby>苦労<rt>くろう</rt></ruby>さまでした」","Stay seated and say「ご苦労さまでした」":"Stay seated and say「ご<ruby>苦労<rt>くろう</rt></ruby>さまでした」","ご苦労さまでした。":"ご<ruby>苦労<rt>くろう</rt></ruby>さまでした。","（ご苦労さま…？）":"（ご<ruby>苦労<rt>くろう</rt></ruby>さま…？）","「ご苦労さま」は目上の人が目下の人に使う言葉。立ってお礼を伝えましょう。":"「ご<ruby>苦労<rt>くろう</rt></ruby>さま」は<ruby>目上<rt>めうえ</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>が<ruby>目下<rt>めした</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>に<ruby>使<rt>つか</rt></ruby>う<ruby>言葉<rt>ことば</rt></ruby>。<ruby>立<rt>た</rt></ruby>ってお<ruby>礼<rt>れい</rt></ruby>を<ruby>伝<rt>つた</rt></ruby>えましょう。","ご苦労さま is what a superior says to someone below them. Stand up and thank them.":"ご<ruby>苦労<rt>くろう</rt></ruby>さま is what a superior says to someone below them. Stand up and thank them.","「ありがとうございましたー」と言いながら、ドアへ歩き出す":"「ありがとうございましたー」と<ruby>言<rt>い</rt></ruby>いながら、ドアへ<ruby>歩<rt>ある</rt></ruby>き<ruby>出<rt>だ</rt></ruby>す","歩きながらの挨拶・お辞儀はNG。立ち止まって、相手の方を向いて挨拶します。":"<ruby>歩<rt>ある</rt></ruby>きながらの<ruby>挨拶<rt>あいさつ</rt></ruby>・お<ruby>辞儀<rt>じぎ</rt></ruby>はNG。<ruby>立<rt>た</rt></ruby>ち<ruby>止<rt>ど</rt></ruby>まって、<ruby>相手<rt>あいて</rt></ruby>の<ruby>方<rt>ほう</rt></ruby>を<ruby>向<rt>む</rt></ruby>いて<ruby>挨拶<rt>あいさつ</rt></ruby>します。","退出のあいさつ":"<ruby>退出<rt>たいしゅつ</rt></ruby>のあいさつ","ドアの前。部屋を出る前に…":"ドアの<ruby>前<rt>まえ</rt></ruby>。<ruby>部屋<rt>へや</rt></ruby>を<ruby>出<rt>で</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に…","振り返って「失礼いたします。」と言ってから、会釈して退出":"<ruby>振<rt>ふ</rt></ruby>り<ruby>返<rt>かえ</rt></ruby>って「<ruby>失礼<rt>しつれい</rt></ruby>いたします。」と<ruby>言<rt>い</rt></ruby>ってから、<ruby>会釈<rt>えしゃく</rt></ruby>して<ruby>退出<rt>たいしゅつ</rt></ruby>","Turn around, say「失礼いたします。」, bow lightly, and leave":"Turn around, say「<ruby>失礼<rt>しつれい</rt></ruby>いたします。」, bow lightly, and leave","退出するときは「失礼します／失礼いたします」と<b>もう一度挨拶</b>します（資料より）。":"<ruby>退出<rt>たいしゅつ</rt></ruby>するときは「<ruby>失礼<rt>しつれい</rt></ruby>します／<ruby>失礼<rt>しつれい</rt></ruby>いたします」と<b>もう<ruby>一度<rt>いちど</rt></ruby><ruby>挨拶<rt>あいさつ</rt></ruby></b>します（<ruby>資料<rt> const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

const chapLabel=ch=>LANG==='en'?`Ch. ${ch.no}`:`第${ch.no}話`;

const panel=document.getElementById('panel'), panelIn=document.getElementById('panelIn'), screenEl=document.getElementById('screen');
const banner=document.getElementById('banner');
let score=50, log=[], CH=null;
let BEST={}; try{ BEST=JSON.parse(store.get('skw-sim-best')||'{}'); }catch(e){}
const saveBest=()=>store.set('skw-sim-best',JSON.stringify(BEST));
function setScore(v){ score=Math.max(0,Math.min(100,v)); meterBar.style.width=score+'%'; meterNum.textContent=score; }
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
function hidePanel(){ panel.classList.remove('show'); rerender=null; }
function ask(step,i,n){
  return new Promise(res=>{
    const opts=shuffle(step.opts);
    const draw=()=>{
      panelIn.innerHTML=`<div class="q"><small>Q${i+1} / ${n}・${LR(step.title,step.titleEn)}</small>${LR(step.q,step.qEn)}</div>
        <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABC'[j]}</span><span>${LR(o.t,o.tEn)}</span></button>`).join('')}</div>`;
      panelIn.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ hidePanel(); res(opts[+b.dataset.j]); });
    };
    draw(); rerender=draw; panel.classList.add('show');
  });
}
function result(step,choice){
  return new Promise(res=>{
    const good=step.opts.find(o=>o.ok);
    const draw=()=>{
      panelIn.innerHTML=`<div class="res ${choice.ok?'ok':'ng'}"><h3>${t(choice.ok?'good':'bad')}</h3>
        ${choice.ok?'':`<div class="model">${t('answer')}${LR(good.t,good.tEn)}</div>`}
        <p>${LR(choice.why,choice.whyEn)}${choice.ok?'':'<br><br>'+LR(good.why,good.whyEn)}</p>
        <button class="btn" id="nextBtn">${t(choice.ok?'next':'nextModel')}</button></div>`;
      nextBtn.onclick=()=>{ hidePanel(); res(); };
    };
    draw(); rerender=draw; panel.classList.add('show'); nextBtn.focus();
  });
}
const stateOf=(ch,st)=>({...(ch.base||{}),...st.state});
async function play(ch){
  CH=ch; setScore(50); log=[]; screenEl.hidden=true; rerender=null; setSign(...ch.sign);
  stepPill.innerHTML=`${chapLabel(ch)} ${LR(ch.title,ch.titleEn)}`;
  await ch.prelude();
  const n=ch.steps.length;
  for(let i=0;i<n;i++){
    const st=ch.steps[i]; stepPill.textContent=`${chapLabel(ch)}  Q${i+1}/${n}`;
    applyState(stateOf(ch,st)); await camTo(st.cam,700);
    const c=await ask(st,i,n);
    await c.act();
    const who=st.npc&&st.npc.visible?st.npc:(ch.hero||P);
    if(c.ok){ emote(who,'😊'); setScore(score+5); }
    else { emote(who,st.npc?'😓':'💦'); setScore(score-10); if(c.react&&st.npc) await say(st.npc,c.react); }
    log.push(st);
    st._ok=c.ok;
    await wait(500);
    await result(st,c);
    if(!c.ok){ applyState(stateOf(ch,st)); await camTo(st.cam,300); banner.innerHTML=t('model'); banner.style.opacity=1; await st.opts.find(o=>o.ok).act(); banner.style.opacity=0; await wait(300); }
    if(st.after) await st.after();
  }
  finish();
}
const RANKS='SABC';
function finish(){
  setPip(null);
  const n=log.filter(l=>l._ok).length;
  const r=score>=90?'S':score>=70?'A':score>=50?'B':'C';
  if(!BEST[CH.id]||RANKS.indexOf(r)<RANKS.indexOf(BEST[CH.id])){ BEST[CH.id]=r; saveBest(); }
  const next=CHAPTERS[CHAPTERS.indexOf(CH)+1];
  const draw=()=>{
    screenEl.innerHTML=`<div class="card" style="text-align:center">
      <div class="eyebrow">${chapLabel(CH)} ${LR(CH.title,CH.titleEn)} ${t('cleared')}</div>
      <div class="rank">${r}</div><h1>${t('r'+r)}</h1>
      <p>${t('impression')} ${score} / 100 ・ ${t('correct')} ${n} / ${CH.steps.length}</p>
      <ul class="log" style="text-align:left">${log.map(l=>`<li><span>${l._ok?'⭕':'❌'}</span><span>${LR(l.title,l.titleEn)}</span></li>`).join('')}</ul>
      <div class="stack">${next?`<button class="btn" id="nextCh">→ ${chapLabel(next)} ${LR(next.title,next.titleEn)}</button>`:''}
        <button class="btn ${next?'ghost':''}" id="again">${t('again')}</button><button class="btn ghost" id="toTitle">${t('toTitle')}</button></div></div>`;
    if(next) nextCh.onclick=()=>play(next);
    again.onclick=()=>play(CH); toTitle.onclick=()=>title();
  };
  screenEl.hidden=false; draw(); rerender=draw;
}

/* =========================================================
   タイトル画面と学習ページ
   ========================================================= */
function tabs(cur){
  return `<div class="tabs" role="tablist">${[['sim','tabSim'],['basics','tabBasics'],['words','tabWords'],['practice','tabPractice']]
    .map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${cur===k}">${t(l)}</button>`).join('')}</div>`;
}
function shell(cur,body,wide){
  screenEl.hidden=false;
  screenEl.innerHTML=`<div class="card ${wide?'wide':''}">
    <div class="topline"><div class="eyebrow">STRANGE KEIGO WORLD</div>${toggleRow()}</div>
    ${tabs(cur)}<div class="tabbody">${body}</div></div>`;
  bindToggles(screenEl);
  screenEl.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>VIEWS[b.dataset.tab]());
}
function title(){
  setSign('株式会社ストレンジ','STRANGE Inc.'); setPip(null); hidePanel();
  applyState({U:RECEP_U,P:{x:-1.2,z:2.0,ry:0.5},S:{x:0.4,z:2.3,ry:-0.6},Y:{x:-0.3,z:3.3,ry:-0.1},C:{x:1.4,z:3.2,ry:-0.5}});
  camera.position.set(1.0,1.8,7.4); camLook.set(-0.1,1.0,2.4);
  stepPill.innerHTML=t('appTitle');
  const draw=()=>{
    shell('sim',`<h1>${t('appTitle')}</h1><p>${t('lead')}</p>
      <div class="chapters">${CHAPTERS.map((c,i)=>`<button class="chap" data-i="${i}"><span class="no">${c.no}</span>
        <span><b>${LR(c.title,c.titleEn)}</b><small>${LR(c.sub,c.subEn)}（${c.steps.length} ${t('qs')}）</small></span><span class="rk">${BEST[c.id]||''}</span></button>`).join('')}</div>
      <p class="small">${t('note')}</p>`);
    screenEl.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{ pickVoice(); play(CHAPTERS[+b.dataset.i]); });
  };
  draw(); rerender=draw;
}

/* ---------- 敬語のきほん ---------- */
const BASICS=[
  {h:['3つの敬語',"The three types of keigo"], cards:true},
  {h:['迷ったら「だれの動作？」',"Not sure? Ask: whose action is it?"],
   b:['<ol class="flow"><li><b>相手</b>（お客様・上司・面接官）の動作 → <span class="badge t-son">尊敬語</span></li><li><b>自分</b>（自分の会社の人）の動作 → <span class="badge t-ken">謙譲語</span></li><li>だれかを上げ下げしない・対等な相手 → <span class="badge t-tei">丁寧語</span>（です・ます）</li></ol>',
      "<ol class=\"flow\"><li>The action of <b>the other person</b> (a customer, your boss, an interviewer) → <span class=\"badge t-son\">尊敬語</span></li><li><b>Your own</b> action (or your company's) → <span class=\"badge t-ken\">謙譲語</span></li><li>Nobody is raised or lowered, or the listener is your equal → <span class=\"badge t-tei\">丁寧語</span> (です／ます)</li></ol>"]},
  {h:['ウチとソト',"Inside (ウチ) and outside (ソト)"],
   b:['社外の人（ソト）と話すとき、自分の会社の人（ウチ）は、上司でも<b>呼び捨て＋謙譲語</b>にします。取引先の人は、だれと話していても<b>様＋尊敬語</b>です。',
      "When you talk to someone outside your company (ソト), people in your company (ウチ), even your boss, get <b>no honorific + humble forms</b>. A client always gets <b>様 + respectful forms</b>, no matter who you are talking to."],
   ex:[['社外の人に、上司のことを話す',"Telling a client about your boss",'山田はただいま会議中でございます。'],
       ['上司に、取引先のことを話す',"Telling your boss about a client",'佐藤様がそうおっしゃっていました。'],
       ['×　社外の人に',"✗ To a client",'山田部長は会議中でいらっしゃいます。']]},
  {h:['敬語の作り方（型）',"How to build keigo (patterns)"],
   b:['特別な形（見る→ご覧になる）がない動詞は、型で作れます。',"Verbs without a special form (like 見る → ご覧になる) follow these patterns."],
   pats:[['son','お＋ます形＋になる','お待ちになる・お読みになる'],['son','ご＋漢語＋になる','ご利用になる・ご説明になる'],['son','〜れる・〜られる','読まれる・来られる'],['son','お〜ください・ご〜ください','お掛けください・ご覧ください'],
         ['ken','お＋ます形＋する／いたす','お持ちする・お待ちいたします'],['ken','ご＋漢語＋する／いたす','ご説明します・ご連絡いたします'],['ken','〜させていただく','利用させていただく'],
         ['tei','です・ます','行きます・学生です'],['tei','ございます','こちらでございます']]},
  {h:['よくある間違い',"Common mistakes"],
   mis:[['おっしゃられる','おっしゃる','二重敬語','Double honorific'],['ご覧になられる','ご覧になる','二重敬語','Double honorific'],['お越しになられる','お越しになる','二重敬語','Double honorific'],
        ['拝見される','ご覧になる','謙譲語＋尊敬語','Humble + respectful mix'],['申される','おっしゃる','謙譲語＋尊敬語','Humble + respectful mix'],['参られる','いらっしゃる','謙譲語＋尊敬語','Humble + respectful mix'],
        ['了解です','承知しました／かしこまりました','目上には×','Not for superiors'],['ご苦労さまです','お疲れさまです','目上には×','Not for superiors']]},
  {h:['呼び方',"Words for people and places"],
   names:[['会社',"company",'御社（話す）／貴社（書く）','弊社'],['学校',"school",'御校（話す）／貴校（書く）','弊校'],['家',"home",'お宅','拙宅'],['自分',"yourself",'—','わたくし'],['人',"person",'〇〇様・〇〇さん','（社外には）呼び捨て']]},
];
const CARD_TXT={
  son:['相手や、相手側の人の動作を<b>高めて</b>、敬意を表す。',"<b>Raises</b> the action of the other person or their side to show respect.",'部長が資料をご覧になる。'],
  ken:['自分や、自分側の人の動作を<b>へりくだって</b>、相手を立てる。',"<b>Lowers</b> your own action (or your side's) to show respect to the other person.",'私が資料を拝見する。'],
  tei:['「です・ます・ございます」で、聞き手に<b>丁寧に</b>話す。',"Speaks <b>politely</b> to the listener with です／ます／ございます.",'資料を見ます。'],
};
function basics(){
  const sec=s=>{
    let h=`<section><h2>${LR(s.h[0],s.h[1])}</h2>`;
    if(s.cards) h+=`<div class="trio">${['son','ken','tei'].map(k=>`<div class="tcard t-${k}"><div class="arrow">${TYPES[k].arrow}</div><b>${rb(TYPES[k].ja)}</b><small>${TYPES[k].en}</small>
      <p>${LR(CARD_TXT[k][0],CARD_TXT[k][1])}</p><p class="ex">${rb(CARD_TXT[k][2])} <button class="say" data-say="${CARD_TXT[k][2]}" aria-label="読み上げ">🔊</button></p></div>`).join('')}</div>`;
    if(s.b) h+=`<div class="txt">${LR(s.b[0],s.b[1])}</div>`;
    if(s.ex) h+=`<div class="exlist">${s.ex.map(([a,b,c])=>`<div><small>${LR(a,b)}</small><span>${rb(c)}</span><button class="say" data-say="${c}" aria-label="読み上げ">🔊</button></div>`).join('')}</div>`;
    if(s.pats) h+=`<div class="pats">${s.pats.map(([k,p,e])=>`<div class="t-${k}"><span class="badge t-${k}">${rb(TYPES[k].ja)}</span><b>${rb(p)}</b><span>${rb(e)}</span></div>`).join('')}</div>`;
    if(s.mis) h+=`<div class="mis">${s.mis.map(([x,o,j,e])=>`<div><span class="x">✗ ${rb(x)}</span><span class="o">→ ${rb(o)}</span><small>${LR(j,e)}</small></div>`).join('')}</div>`;
    if(s.names) h+=`<table class="names"><thead><tr><th></th><th>${LR('相手側',"Their side")}</th><th>${LR('自分側',"Your side")}</th></tr></thead><tbody>${s.names.map(([a,e,b,c])=>`<tr><th>${rb(a)}<small>${e}</small></th><td>${rb(b)}</td><td>${rb(c)}</td></tr>`).join('')}</tbody></table>`;
    return h+'</section>';
  };
  const draw=()=>{ shell('basics',BASICS.map(sec).join(''),true); };
  draw(); rerender=draw;
}

/* ---------- 単語帳 ---------- */
let wordFilter='', openWords=new Set();
function words(){
  const draw=()=>{
    shell('words',`<p class="small">${t('tapOpen')}</p><input class="search" id="wq" placeholder="${UI.search[LANG==='en'?1:0]}" value="${wordFilter.replace(/"/g,'')}"><div id="wlist"></div>`,true);
    const list=()=>{
      const f=wordFilter.trim().toLowerCase();
      const vs=VERBS.filter(v=>!f||[v.base,v.en,...v.son,...v.ken,...v.tei].some(s=>s.toLowerCase().includes(f)));
      wlist.innerHTML=vs.map(v=>`<div class="vrow ${openWords.has(v.base)?'open':''}" data-b="${v.base}"><button class="vh"><span class="base">${rb(v.base)}</span><span class="mean">${v.en}</span><span class="chev">›</span></button>
        <div class="vbody">${['son','ken','tei'].map(k=>`<div class="vcell t-${k}"><span class="lab">${rb(TYPES[k].ja)}<small>${TYPES[k].en}</small></span>
          <span class="words">${v[k].map(x=>`<button class="word" data-say="${x}">${rb(x)} <i>🔊</i></button>`).join('')}</span></div>`).join('')}
          ${v.note?`<p class="note">💡 ${LR(v.note,v.noteEn)}</p>`:''}</div></div>`).join('')||`<p class="small">${t('notFound')}</p>`;
      wlist.querySelectorAll('.vh').forEach(b=>b.onclick=()=>{ const r=b.parentElement; r.classList.toggle('open'); r.classList.contains('open')?openWords.add(r.dataset.b):openWords.delete(r.dataset.b); });
    };
    list(); wq.oninput=e=>{ wordFilter=e.target.value; list(); };
  };
  draw(); rerender=draw;
}

/* ---------- 練習（言い換え4択） ---------- */
let PQ=null, pStat={ok:0,n:0};
function newPracticeQ(){
  const v=pick(VERBS), k=pick(['son','ken','son','ken','tei']);
  const ans=pick(v[k]);
  const others=['son','ken','tei'].filter(x=>x!==k).map(x=>v[x][0]);
  const extra=k==='tei'?v.base:pick(VERBS.filter(o=>o!==v).flatMap(o=>o[k]).filter(x=>!v[k].includes(x)));
  PQ={v,k,ans,opts:shuffle([...new Set([ans,...others,extra])]),picked:null};
}
function practice(){
  if(!PQ) newPracticeQ();
  const draw=()=>{
    const {v,k,opts,picked}=PQ, done=picked!=null, right=done&&v[k].includes(picked);
    shell('practice',`<p class="small">${t('pIntro')}　${t('pScore')} ${pStat.ok} / ${pStat.n}</p>
      <div class="pq"><span class="big">${rb(v.base)}</span><span class="mean">${v.en}</span>
        <div class="pto">${LANG==='en'?t('pPrompt')+' ':''}<span class="badge t-${k}">${rb(TYPES[k].ja)}</span> <small>${TYPES[k].en}</small>${LANG==='en'?'':' '+t('pPrompt')}</div></div>
      <div class="opts">${opts.map((o,j)=>{ let c=''; if(done){ if(v[k].includes(o)) c='sel-ok'; else if(o===picked) c='sel-ng'; else c='dim'; }
        return `<button class="opt ${c}" data-j="${j}" ${done?'disabled':''}><span class="k">${'ABCD'[j]}</span><span>${rb(o)}</span></button>`; }).join('')}</div>
      ${done?`<div class="pres ${right?'ok':'ng'}"><b>${t(right?'pRight':'pWrong')}</b>
        ${['son','ken','tei'].map(x=>`<div><span class="badge t-${x}">${rb(TYPES[x].ja)}</span> ${v[x].map(rb).join('、')}</div>`).join('')}
        ${v.note?`<div class="note">💡 ${LR(v.note,v.noteEn)}</div>`:''}
        <button class="btn" id="pNext">${t('pNext')}</button></div>`:''}`,true);
    screenEl.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>{ PQ.picked=opts[+b.dataset.j]; pStat.n++; if(v[k].includes(PQ.picked)) pStat.ok++; tts(PQ.ans,1); draw(); });
    if(done){ pNext.onclick=()=>{ newPracticeQ(); draw(); }; pNext.focus(); }
  };
  draw(); rerender=draw;
}
const VIEWS={sim:title,basics,words,practice};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); try{speechSynthesis.cancel();}catch(_){} tts(b.dataset.say,1); } });

soundBtn.onclick=()=>{ soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇'; if(!soundOn) try{speechSynthesis.cancel();}catch(e){} };
langBtn.onclick=()=>setLang(LANG==='en'?'ja':'en');
furiBtn.onclick=()=>setFuri(!FURI);
applyLangUI();
title();
</script>
