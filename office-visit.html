<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ビジネス敬語シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* 全画面の3Dステージ＋下から出る選択パネル。電話の場面は右上に相手側の小窓。単一の明るい世界観（テーマ切替なし） */
:root{
  --sky:#cfe6f2; --ink:#2d2a3e; --muted:#6f6a80; --paper:#fffaf2; --line:#eadfcd;
  --accent:#ff7a59; --accent-ink:#ffffff; --ok:#1f9d63; --ok-bg:#e3f6ec; --ng:#e0484e; --ng-bg:#fde8e8;
  --font:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
#stage canvas{display:block;width:100%;height:100%}
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.hud{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{pointer-events:auto;background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:52vw}
.meter{flex:1;max-width:220px;margin-left:auto;background:var(--paper);border-radius:999px;padding:5px 10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08);min-width:84px}
.meter .bar{flex:1;height:10px;border-radius:99px;background:#efe6d6;overflow:hidden}
.meter .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#ffb35c,var(--accent));border-radius:99px;transition:width .5s}
.iconbtn{border:0;background:var(--paper);border-radius:999px;width:34px;height:34px;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.08);pointer-events:auto;flex:none}

.pipframe{position:fixed;border:3px solid #fff;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:none}
.pipframe span{position:absolute;left:6px;top:-12px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;background:var(--ink);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}

.bubble{position:absolute;width:max-content;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border-radius:14px;padding:7px 11px;font-size:14px;line-height:1.45;max-width:min(250px,64vw);box-shadow:0 3px 10px rgba(0,0,0,.14);font-weight:700}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble .who{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.bubble.tel{background:#2d2a3e;color:#fff}.bubble.tel::after{border-top-color:#2d2a3e}.bubble.tel .who{color:#cfc8e8}
.bubble.below{transform:translate(-50%,0)}.bubble.below::after{bottom:auto;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#2d2a3e}
.emo{position:absolute;transform:translate(-50%,-100%);font-size:34px;animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-60%) scale(.4)}20%{opacity:1;transform:translate(-50%,-100%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}

.panel{position:fixed;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .3s ease}
.panel.show{transform:none}
.panel .in{max-width:640px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.12);max-height:62vh;overflow:auto}
.q{font-weight:800;font-size:16px;line-height:1.5;margin:2px 0 10px;text-wrap:balance}
.q small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:700;line-height:1.5}
.opt:active{transform:translateY(2px)}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;background:var(--sky);display:grid;place-items:center;font-size:12px;font-weight:800}
.res h3{margin:0 0 4px;font-size:20px}
.res.ok h3{color:var(--ok)} .res.ng h3{color:var(--ng)}
.res .model{background:var(--ok-bg);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;margin:6px 0}
.res p{margin:6px 0 12px;font-size:14px;line-height:1.65}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:rgba(45,42,62,.75);color:#fff;font-size:12px;border-radius:999px;padding:5px 12px;pointer-events:none;transition:opacity .3s}
.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:800;border-radius:999px;padding:6px 16px;font-size:14px;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.caption{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(45,42,62,.88);color:#fff;font-weight:800;border-radius:16px;padding:12px 20px;font-size:17px;text-align:center;pointer-events:none;transition:opacity .4s;max-width:86vw;line-height:1.5}

.screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(207,230,242,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:100%;max-width:460px;background:var(--paper);border-radius:24px;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.15);max-height:calc(100% - 20px);overflow:auto}
.card h1{font-size:25px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.card p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.6}
.chapters{display:grid;gap:8px;margin-bottom:6px}
.chap{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:16px;padding:10px 12px}
.chap:active{transform:translateY(2px)}
.chap b{display:block;font-size:15px}
.chap small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.chap .no{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-weight:800}
.chap .rk{margin-left:auto;flex:none;font-weight:800;color:var(--accent);font-size:20px;min-width:22px;text-align:center}
.rank{font-size:64px;font-weight:800;color:var(--accent);line-height:1;margin:6px 0}
.log{list-style:none;padding:0;margin:10px 0 16px;display:grid;gap:6px;font-size:14px}
.log li{display:flex;gap:8px;background:#fff;border-radius:10px;padding:6px 10px}
.stack{display:grid;gap:8px}
/* ふりがな（rt を隠すだけで切り替え） */
ruby{ruby-position:over} rt{font-size:.5em;font-weight:500;letter-spacing:0;opacity:.85}
body.nofuri rt{display:none}
.bubble{line-height:1.75}
.toggles{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:4px 11px;font-size:12.5px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hudbtn{border:0;background:var(--paper);border-radius:999px;height:34px;min-width:34px;padding:0 9px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08);pointer-events:auto;flex:none}
.hudbtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.card.wide{max-width:680px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:4px;background:#f1e8da;border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:7px 8px;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.small{font-size:12.5px!important;color:var(--muted)}
.tabbody h2{font-size:17px;margin:20px 0 8px;text-wrap:balance}
.tabbody section:first-child h2{margin-top:4px}
.txt{font-size:14px;line-height:1.75}
.t-son{--c:#d23b62;--cb:#ffe3ea}.t-ken{--c:#2a6fcc;--cb:#e1eeff}.t-tei{--c:#178a66;--cb:#dcf5ec}
.badge{display:inline-block;padding:0 9px;border-radius:999px;background:var(--cb);color:var(--c);font-weight:800;font-size:13px;line-height:1.9}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcard{background:var(--cb);border-radius:16px;padding:12px 10px;text-align:center;min-width:0}
.tcard .arrow{font-size:24px;line-height:1}.tcard>b{color:var(--c);display:block;font-size:17px;margin-top:4px}.tcard p b{color:var(--c)}
.tcard small{color:var(--muted);font-size:11px;font-weight:700}
.tcard p{margin:6px 0 0;font-size:12.5px;line-height:1.6;text-align:left}
.tcard .ex{background:#fff;border-radius:10px;padding:6px 8px;font-weight:700}
.say{border:0;background:none;padding:0 2px;font-size:13px}
.flow{margin:0;padding-left:20px;font-size:14px;line-height:2}
.exlist{display:grid;gap:6px;margin-top:8px}
.exlist div{background:#fff;border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-weight:700;font-size:14.5px}
.exlist small{width:100%;color:var(--muted);font-weight:700;font-size:11.5px}
.pats{display:grid;gap:6px}
.pats div{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;background:var(--cb);border-radius:12px;padding:7px 10px}
.pats b{font-size:14.5px}.pats div>span:last-child{grid-column:2;font-size:13px;color:var(--muted)}
.mis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mis div{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;display:flex;flex-direction:column}
.mis .x{color:var(--ng);font-weight:800;text-decoration:line-through;text-decoration-thickness:1px}.mis .o{color:var(--ok);font-weight:800}.mis small{color:var(--muted);font-size:11.5px}
.names{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
.names th,.names td{background:#fff;padding:6px 8px;text-align:left;vertical-align:top}
.names thead th{background:none;color:var(--muted);font-size:12px;padding-bottom:0}
.names tbody th{border-radius:10px 0 0 10px}.names td:last-child{border-radius:0 10px 10px 0}
.names th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.search{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;margin-bottom:10px}
.vrow{background:#fff;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.vh{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:none;border:0;text-align:left}
.vh .base{font-size:19px;font-weight:800}.mean{color:var(--muted);font-size:13px}
.vh .chev{margin-left:auto;color:var(--muted);transition:transform .2s}.vrow.open .chev{transform:rotate(90deg)}
.vbody{display:none;padding:0 10px 10px;gap:6px}.vrow.open .vbody{display:grid}
.vcell{border-radius:12px;padding:7px 9px;background:var(--cb);display:flex;gap:8px;align-items:flex-start}
.vcell .lab{flex:none;color:var(--c);font-weight:800;font-size:13px;width:66px;line-height:1.5}
.vcell .lab small{display:block;font-size:10.5px;color:var(--muted)}
.words{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.word{background:#fff;border:0;border-radius:10px;padding:2px 9px;font-weight:700;font-size:15px;line-height:1.9}
.word i{font-style:normal;font-size:11px;opacity:.6}
.note{font-size:12.5px;color:var(--muted);margin:2px}
.pq{text-align:center;margin:6px 0 14px}
.pq .big{display:inline-block;font-size:34px;font-weight:800;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 16px}
.pq .mean{display:block;margin-top:4px}.pto{margin-top:8px;font-weight:800;font-size:16px}.pto small{color:var(--muted);font-size:12px}
.opt.sel-ok{background:var(--ok-bg);border-color:var(--ok)}.opt.sel-ng{background:var(--ng-bg);border-color:var(--ng)}.opt.dim{opacity:.45}
.pres{margin-top:12px;border-radius:14px;padding:10px 12px;display:grid;gap:5px;font-size:14px}
.pres.ok{background:var(--ok-bg)}.pres.ng{background:var(--ng-bg)}.pres>b{font-size:17px}.pres.ok>b{color:var(--ok)}.pres.ng>b{color:var(--ng)}
.pres .btn{margin-top:6px}
@media (max-width:480px){.trio{grid-template-columns:1fr}.mis{grid-template-columns:1fr}}
/* キャラ作成：3Dの主人公が見えるよう、背景をぼかさずカードを下（横長なら右）に置く */
/* キャラ作成のプレビュー枠：カードの中に置き、スクロールしても上に貼りつく */
.preview{position:sticky;top:-22px;z-index:2;display:block;width:100%;height:min(34vh,280px);margin:0 0 14px;border-radius:18px;background:#cfe6f2;box-shadow:0 8px 0 var(--paper)}
.cfield{display:grid;gap:6px;margin:0 0 14px}
.cfield>span{font-size:13px;font-weight:800;color:var(--muted)}
.cfield input{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:16px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.swl{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:700}
.hairs{display:flex;gap:6px;flex-wrap:wrap}
.hairs .chip{font-size:13.5px;padding:6px 12px}
.youline{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:0 0 12px;font-weight:800}
.youline .chip{margin-left:auto}
@media (prefers-reduced-motion:reduce){.panel,.meter .bar i{transition:none}.emo{animation-duration:.01s}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="pipframe" id="pipFrame" hidden><span id="pipLabel">📞 通話中</span></div>
<div id="overlay"></div>
<div class="hud">
  <button class="iconbtn" id="pauseBtn" aria-label="一時停止 / Pause" hidden>⏸</button>
  <span class="pill" id="stepPill">ビジネス敬語シミュレーター</span>
  <div class="meter"><span id="meterLabel">印象</span><span class="bar"><i id="meterBar"></i></span><span id="meterNum">50</span></div>
  <button class="hudbtn" id="furiBtn" aria-pressed="true" aria-label="ふりがな / Furigana">ふ</button><button class="hudbtn" id="langBtn" aria-label="Language">EN</button><button class="iconbtn" id="soundBtn" aria-label="音声のオンオフ">🔊</button>
</div>
<div class="banner" id="banner" style="opacity:0">お手本</div>
<div class="caption" id="captionEl" style="opacity:0"></div>
<div class="hint" id="hint" style="opacity:0"></div>
<div class="panel" id="panel"><div class="in" id="panelIn"></div></div>
<div class="screen" id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   3D の土台
   ========================================================= */
const stage=document.getElementById('stage'), overlay=document.getElementById('overlay');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#cfe6f2'); scene.fog=new THREE.Fog('#cfe6f2',16,34);
const camera=new THREE.PerspectiveCamera(45,1,0.1,100);
const camLook=new THREE.Vector3(0,1,0);
const cam2=new THREE.PerspectiveCamera(38,1.33,0.1,40);
const pipLook=new THREE.Vector3();
camera.position.set(1,5.5,10);
const portrait=()=>innerWidth<innerHeight;
function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h);
  camera.aspect=w/h; camera.fov=portrait()?62:42;
  // 被写体は画面の中央より少し下に置き、頭の上の吹き出しが見切れないようにする（下の選択パネルとは重なってよい）
  camera.setViewOffset(w,h,0,h*(portrait()?-0.06:0.02),w,h);
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

scene.add(new THREE.HemisphereLight('#ffffff','#bba98c',0.85));
const sun=new THREE.DirectionalLight('#fff3e0',0.75); sun.position.set(5,12,8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:60});
sun.target.position.set(2,0,4); scene.add(sun.target); scene.add(sun);

const ANIM=[], PACHI_F=[];
const mat=c=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.85});
function box(w,h,d,c,x=0,y=0,z=0,parent=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function cyl(rt,rb,h,c,x,y,z,seg=7,parent=scene){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c)); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}
function plant(x,z,s=1){ cyl(0.22*s,0.17*s,0.45*s,'#c9764b',x,0.22*s,z); const l=new THREE.Mesh(new THREE.IcosahedronGeometry(0.42*s,0),mat('#5fa36a'));
  l.position.set(x,0.85*s,z); l.castShadow=true; scene.add(l); const l2=l.clone(); l2.scale.setScalar(.7); l2.position.y=1.25*s; scene.add(l2); }
function chair(x,z,ry,c='#5b6b8c'){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
  box(0.52,0.09,0.5,c,0,0.45,0,g); box(0.52,0.62,0.09,c,0,0.78,-0.22,g);
  [[-0.22,-0.2],[0.22,-0.2],[-0.22,0.2],[0.22,0.2]].forEach(([a,b])=>box(0.05,0.42,0.05,'#444',a,0.21,b,g));
}
function desk(x,z,w=1.4,d=0.7){ box(w,0.06,d,'#efe9df',x,0.74,z); box(0.06,0.72,d-0.05,'#b9b2a6',x-w/2+0.05,0.36,z); box(0.06,0.72,d-0.05,'#b9b2a6',x+w/2-0.05,0.36,z); }

/* ---------- ゾーンA：受付と応接室（会社の看板は話ごとに差し替え） ---------- */

function wallClock(x,y,z,ry=0){
  const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; scene.add(g);
  const f=cyl(0.22,0.22,0.04,'#ffffff',0,0,0,16,g); f.rotation.x=Math.PI/2; cyl(0.24,0.24,0.03,'#3b3b3b',0,0,-0.01,16,g).rotation.x=Math.PI/2;

  const hh=hand(0.12,0.025,'#222'), mm=hand(0.18,0.018,'#222'), ss=hand(0.19,0.008,'#c0392b');

const FEMALE_VOICE=/kyoko|haruka|ayumi|nanami|sayaka|mizuki|shiori|aoi|google 日本語|female|女性/i;
const MALE_VOICE=/otoya|ichiro|keita|daichi|naoki|takumi|hattori|\bmale\b|男性/i;
function pickVoice(){ try{ const ja=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  VOICE=ja[0]||null; VOICE_F=ja.find(v=>FEMALE_VOICE.test(v.name))||null; VOICE_M=ja.find(v=>!FEMALE_VOICE.test(v.name)&&MALE_VOICE.test(v.name))||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function tts(text,pitch,gender,mul=1){
  return new Promise(res=>{
    if(!soundOn||!('speechSynthesis' in window)) return res();
    const own=gender==='female'?VOICE_F:gender==='male'?VOICE_M:null;
    try{ const u=new SpeechSynthesisUtterance(text.replace(/[（(].*?[）)]/g,'')); u.lang='ja-JP'; u.voice=own||VOICE||null;
      // 性別に合う声があれば高さは控えめに調整、無ければ高さで男女を出す
      u.pitch=Math.min(2,Math.max(0,(own?1+(pitch-1)*0.4:pitch)*mul)); u.rate=1.05;
      u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); }catch(e){ res(); }
  });
}

function loop(now){

    if(k>=1){ TW.splice(TW.indexOf(t),1); t.r(); }
  }
  const s=now/1000;
  for(const p of Object.values(ACTORS)){
    if(p.walking){ const a=Math.sin(s*9)*0.45; p.u.thL.rotation.x=a; p.u.thR.rotation.x=-a; p.u.armL.rotation.x=-a*.5; if(!p.u.phone.visible) p.u.armR.rotation.x=a*.5; p.u.hips.position.y=0.85+Math.abs(Math.cos(s*9))*0.03; }
    const b=(s+p.blink)%4<0.12; p.u.eyes.forEach(e=>e.scale.y=b?0.15:1);
    if(!p.visible) continue;
    p.u.mouth.scale.y=p.talking?1+Math.abs(Math.sin(s*15+p.blink))*2.6:1;
    p.u.torso.position.y=Math.sin(s*2.1+p.blink)*0.006;
    let yaw=Math.sin(s*0.45+p.blink*2)*0.07;

    else if(SPEAKER&&SPEAKER!==p&&SPEAKER.visible){ const dx=SPEAKER.position.x-p.position.x, dz=SPEAKER.position.z-p.position.z;
      if(dx*dx+dz*dz<25){ let d=Math.atan2(dx,dz)-p.rotation.y; d=((d+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; yaw=Math.max(-0.75,Math.min(0.75,d)); } }
    p.u.head.rotation.y+=(yaw-p.u.head.rotation.y)*0.08;
  }
  for(const f of ANIM) f(s);

uby>言<rt>い</rt></ruby>って、<ruby>鈴木<rt>すずき</rt></ruby><ruby>様<rt>さま</rt></ruby>の<ruby>席<rt>せき</rt></ruby>に<ruby>座<rt>すわ</rt></ruby>る","Say「じゃ、遠慮なく〜」and sit in Ms./Mr. Suzuki's seat":"Say「じゃ、<ruby>遠慮<rt>えんりょ</rt></ruby>なく〜」and sit in Ms./Mr. Suzuki's seat","そこ、私の席です…":"そこ、<ruby>私<rt>わたし</rt></ruby>の<ruby>席<rt>せき</rt></ruby>です…","すすめられた席に「失礼いたします」と言って座ります。":"すすめられた<ruby>席<rt>せき</rt></ruby>に「<ruby>失礼<rt>しつれい</rt></ruby>いたします」と<ruby>言<rt>い</rt></ruby>って<ruby>座<rt>すわ</rt></ruby>ります。","Sit in the seat you are offered, saying 失礼いたします.":"Sit in the seat you are offered, saying <ruby>失礼<rt>しつれい</rt></ruby>いたします.","「いや、見てないっす。字多くてだるかったんで。」":"「いや、<ruby>見<rt>み</rt></ruby>てないっす。<ruby>字<rt>じ</rt></ruby><ruby>多<rt>おお</rt></ruby>くてだるかったんで。」","タメ口のうえ、読んでいないのは準備不足。「拝見しました」と言えるようにしておきましょう。":"タメ<ruby>口<rt>ぐち</rt></ruby>のうえ、<ruby>読<rt>よ</rt></ruby>んでいないのは<ruby>準備<rt>じゅんび</rt></ruby><ruby>不足<rt>ふそく</rt></ruby>。「<ruby>拝見<rt>はいけん</rt></ruby>しました」と<ruby>言<rt>い</rt></ruby>えるようにしておきましょう。","Casual speech, and not reading it means you did not prepare. Read it so you can say 拝見しました.":"Casual speech, and not reading it means you did not prepare. Read it so you can say <ruby>拝見<rt>はいけん</rt></ruby>しました.","「で、ぶっちゃけ給料いくらっすか？」":"「で、ぶっちゃけ<ruby>給料<rt>きゅうりょう</rt></ruby>いくらっすか？」","「ぶっちゃけ」「〜っす」は話し言葉の中でもくだけすぎ。聞き方は「伺ってもよろしいでしょうか」。":"「ぶっちゃけ」「〜っす」は<ruby>話<rt>はな</rt></ruby>し<ruby>言葉<rt>ことば</rt></ruby>の<ruby>中<rt>なか</rt></ruby>でもくだけすぎ。<ruby>聞<rt>き</rt></ruby>き<ruby>方<rt>かた</rt></ruby>は「<ruby>伺<rt>うかが</rt></ruby>ってもよろしいでしょうか」。","ぶっちゃけ and 〜っす are far too casual. Ask with 伺ってもよろしいでしょうか.":"ぶっちゃけ and 〜っす are far too casual. Ask with <ruby>伺<rt>うかが</rt></ruby>ってもよろしいでしょうか.","「おつかれっしたー！じゃ、また！」と言って手を振る":"「おつかれっしたー！じゃ、また！」と<ruby>言<rt>い</rt></ruby>って<ruby>手<rt>て</rt></ruby>を<ruby>振<rt>ふ</rt></ruby>る","「お疲れさま」は目上の人へのお礼には使いません。「本日はありがとうございました」。":"「お<ruby>疲<rt>つか</rt></ruby>れさま」は<ruby>目上<rt>めうえ</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>へのお<ruby>礼<rt>れい</rt></ruby>には<ruby>使<rt>つか</rt></ruby>いません。「<ruby>本日<rt>ほんじつ</rt></ruby>はありがとうございました」。","お疲れさま is not a thank-you for a superior. Say 本日はありがとうございました.":"お<ruby>疲<rt>つか</rt></ruby>れさま is not a thank-you for a superior. Say <ruby>本日<rt>ほんじつ</rt></ruby>はありがとうございました.","「バイバーイ！」と大きく手を振って、ドアを開けっぱなしで出る":"「バイバーイ！」と<ruby>大<rt>おお</rt></ruby>きく<ruby>手<rt>て</rt></ruby>を<ruby>振<rt>ふ</rt></ruby>って、ドアを<ruby>開<rt>あ</rt></ruby>けっぱなしで<ruby>出<rt>で</rt></ruby>る","最後の印象は残ります。振り返って「失礼いたします」、会釈してから静かに閉めます。":"<ruby>最後<rt>さいご</rt></ruby>の<ruby>印象<rt>いんしょう</rt></ruby>は<ruby>残<rt>のこ</rt></ruby>ります。<ruby>振<rt>ふ</rt></ruby>り<ruby>返<rt>かえ</rt></ruby>って「<ruby>失礼<rt>しつれい</rt></ruby>いたします」、<ruby>会釈<rt>えしゃく</rt></ruby>してから<ruby>静<rt>しず</rt></ruby>かに<ruby>閉<rt>し</rt></ruby>めます。","The last impression stays. Turn, say 失礼いたします, bow, and close the door quietly.":"The last impression stays. Turn, say <ruby>失礼<rt>しつれい</rt></ruby>いたします, bow, and close the door quietly.","満員電車の中で、ポテトを食べながらかける":"<ruby>満員<rt>まんいん</rt></ruby><ruby>電車<rt>でんしゃ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で、ポテトを<ruby>食<rt>た</rt></ruby>べながらかける","うるさい場所・食べながらは論外。静かな場所で、メモを用意してかけます。":"うるさい<ruby>場所<rt>ばしょ</rt></ruby>・<ruby>食<rt>た</rt></ruby>べながらは<ruby>論外<rt>ろんがい</rt></ruby>。<ruby>静<rt>しず</rt></ruby>かな<ruby>場所<rt>ばしょ</rt></ruby>で、メモを<ruby>用意<rt>ようい</rt></ruby>してかけます。","…どちら様でしょうか。":"…どちら<ruby>様<rt>さま</rt></ruby>でしょうか。","詐欺の電話のようです。「大学名・学部・名前」をはっきり名乗ります。":"<ruby>詐欺<rt>さぎ</rt></ruby>の<ruby>電話<rt>でんわ</rt></ruby>のようです。「<ruby>大学<rt>だいがく</rt></ruby><ruby>名<rt>めい</rt></ruby>・<ruby>学部<rt>がくぶ</rt></ruby>・<ruby>名前<rt>なまえ</rt></ruby>」をはっきり<ruby>名乗<rt>なの</rt></ruby>ります。","「鈴木っていう人、出してくれる？」":"「<ruby>鈴木<rt>すずき</rt></ruby>っていう<ruby>人<rt>ひと</rt></ruby>、<ruby>出<rt>だ</rt></ruby>してくれる？」","…少々お待ちください。":"…<ruby>少々<rt>しょうしょう</rt></ruby>お<ruby>待<rt>ま</rt></ruby>ちください。","相手の会社の人を呼び捨て＋命令口調。「鈴木様はいらっしゃいますでしょうか」。":"<ruby>相手<rt>あいて</rt></ruby>の<ruby>会社<rt>かいしゃ</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>を<ruby>呼<rt>よ</rt></ruby>び<ruby>捨<rt>す</rt></ruby>て＋<ruby>命令<rt>めいれい</rt></ruby><ruby>口調<rt>くちょう</rt></ruby>。「<ruby>鈴木<rt>すずき</rt></ruby><ruby>様<rt>さま</rt></ruby>はいらっしゃいますでしょうか」。","No honorific and a command. Say 鈴木様はいらっしゃいますでしょうか.":"No honorific and a command. Say <ruby>鈴木<rt>すずき</rt></ruby><ruby>様<rt>さま</rt></ruby>はいらっしゃいますでしょうか.","「じゃあ戻ったら折り返させといて〜。」":"「じゃあ<ruby>戻<rt>もど</rt></ruby>ったら<ruby>折<rt>お</rt></ruby>り<ruby>返<rt>かえ</rt></ruby>させといて〜。」","お願いしているのはこちら。自分から「改めてお電話いたします」と言います。":"お<ruby>願<rt>ねが</rt></ruby>いしているのはこちら。<ruby>自分<rt>じぶん</rt></ruby>から「<ruby>改<rt>あらた</rt></ruby>めてお<ruby>電話<rt>でんわ</rt></ruby>いたします」と<ruby>言<rt>い</rt></ruby>います。","You are the one asking a favor. Offer 改めてお電話いたします yourself.":"You are the one asking a favor. Offer <ruby>改<rt>あらた</rt></ruby>めてお<ruby>電話<rt>でんわ</rt></ruby>いたします yourself.","「あ、鈴木さん？ヒマ？ちょっと話あるんだけど。」":"「あ、<ruby>鈴木<rt>すずき</rt></ruby>さん？ヒマ？ちょっと<ruby>話<rt>はなし</rt></ruby>あるんだけど。」","相手の時間をいただく電話です。「今、お時間よろしいでしょうか」。":"<ruby>相手<rt>あいて</rt></ruby>の<ruby>時間<rt>じかん</rt></ruby>をいただく<ruby>電話<rt>でんわ</rt></ruby>です。「<ruby>今<rt>いま</rt></ruby>、お<ruby>時間<rt>じかん</rt></ruby>よろしいでしょうか」。","You are taking their time. Ask 今、お時間よろしいでしょうか.":"You are taking their time. Ask <ruby>今<rt>いま</rt></ruby>、お<ruby>時間<rt>じかん</rt></ruby>よろしいでしょうか.","「5日の14時に行くんで、よろしく〜。」":"「<ruby>5日<rt>いつか</rt></ruby>の14<ruby>時<rt>じ</rt></ruby>に<ruby>行<rt>い</rt></ruby>くんで、よろしく〜。」","決定事項なんですね…":"<ruby>決定<rt>けってい</rt></ruby><ruby>事項<rt>じこう</rt></ruby>なんですね…","こちらから決めつけるのは×。「ご都合いかがでしょうか」と相手の都合を聞きます。":"こちらから<ruby>決<rt>き</rt></ruby>めつけるのは×。「ご<ruby>都合<rt>つごう</rt></ruby>いかがでしょうか」と<ruby>相手<rt>あいて</rt></ruby>の<ruby>都合<rt>つごう</rt></ruby>を<ruby>聞<rt>き</rt></ruby>きます。","Do not decide for them. Ask about their schedule with ご都合いかがでしょうか.":"Do not decide for them. Ask about their schedule with ご<ruby>都合<rt>つごう</rt></ruby>いかがでしょうか.","断られても、別の候補日を出して相談を続けます。":"<ruby>断<rt>ことわ</rt></ruby>られても、<ruby>別<rt>べつ</rt></ruby>の<ruby>候補<rt>こうほ</rt></ruby><ruby>日<rt>び</rt></ruby>を<ruby>出<rt>だ</rt></ruby>して<ruby>相談<rt>そうだん</rt></ruby>を<ruby>続<rt>つづ</rt></ruby>けます。","日時はあいまいにせず、「11月6日（金）10時」と復唱して確認します。":"<ruby>日時<rt>にちじ</rt></ruby>はあいまいにせず、「11<ruby>月<rt>がつ</rt></ruby><ruby>6日<rt>むいか</rt></ruby>（<ruby>金<rt>きん</rt></ruby>）10<ruby>時<rt>じ</rt></ruby>」と<ruby>復唱<rt>ふくしょう</rt></ruby>して<ruby>確認<rt>かくにん</rt></ruby>します。","「じゃあね〜！」と言って、すぐにガチャンと切る":"「じゃあね〜！」と<ruby>言<rt>い</rt></ruby>って、すぐにガチャンと<ruby>切<rt>き</rt></ruby>る","かけた側でも、目上の相手が切るのを待ってから静かに切ります。":"かけた<ruby>側<rt>がわ</rt></ruby>でも、<ruby>目上<rt>めうえ</rt></ruby>の<ruby>相手<rt>あいて</rt></ruby>が<ruby>切<rt>き</rt></ruby>るのを<ruby>待<rt>ま</rt></ruby>ってから<ruby>静<rt>しず</rt></ruby>かに<ruby>切<rt>き</rt></ruby>ります。","鳴っている電話を、そっと引き出しにしまう":"<ruby>鳴<rt>な</rt></ruby>っている<ruby>電話<rt>でんわ</rt></ruby>を、そっと<ruby>引<rt>ひ</rt></ruby>き<ruby>出<rt>だ</rt></ruby>しにしまう","会社の電話は会社の顔。3コール以内に出て、社名を名乗ります。":"<ruby>会社<rt>かいしゃ</rt></ruby>の<ruby>電話<rt>でんわ</rt></ruby>は<ruby>会社<rt>かいしゃ</rt></ruby>の<ruby>顔<rt>かお</rt></ruby>。3コール<ruby>以内<rt>いない</rt></ruby>に<ruby>出<rt>で</rt></ruby>て、<ruby>社名<rt>しゃめい</rt></ruby>を<ruby>名乗<rt>なの</rt></ruby>ります。","「あー、佐藤さんね！ちっす！」":"「あー、<ruby>佐藤<rt>さとう</rt></ruby>さんね！ちっす！」","取引先には「こちらこそ、いつもお世話になっております」。":"<ruby>取引先<rt>とりひきさき</rt></ruby>には「こちらこそ、いつもお<ruby>世話<rt>せわ</rt></ruby>になっております」。","To a client, say こちらこそ、いつもお世話になっております.":"To a client, say こちらこそ、いつもお<ruby>世話<rt>せわ</rt></ruby>になっております.","「部長？知らないっす。サボりじゃないっすか？」":"「<ruby>部長<rt>ぶちょう</rt></ruby>？<ruby>知<rt>し</rt></ruby>らないっす。サボりじゃないっすか？」","社内の人の悪口は論外。「山田はただいま会議中でございます」。":"<ruby>社内<rt>しゃない</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>の<ruby>悪口<rt>わるぐち</rt></ruby>は<ruby>論外<rt>ろんがい</rt></ruby>。「<ruby>山田<rt>やまだ</rt></ruby>はただいま<ruby>会議<rt>かいぎ</rt></ruby><ruby>中<rt>ちゅう</rt></ruby>でございます」。","Never badmouth a colleague. Say 山田はただいま会議中でございます.":"Never badmouth a colleague. Say <ruby>山田<rt>やまだ</rt></ruby>はただいま<ruby>会議<rt>かいぎ</rt></ruby><ruby>中<rt>ちゅう</rt></ruby>でございます.","「さあ？気分次第っすね。」":"「さあ？<ruby>気分<rt>きぶん</rt></ruby><ruby>次第<rt>しだい</rt></ruby>っすね。」","気分次第…":"<ruby>気分<rt>きぶん</rt></ruby><ruby>次第<rt>しだい</rt></ruby>…","わかっている予定を、丁寧に伝えます。":"わかっている<ruby>予定<rt>よてい</rt></ruby>を、<ruby>丁寧<rt>ていねい</rt></ruby>に<ruby>伝<rt>つた</rt></ruby>えます。","「無理っす。メモとか苦手なんで。」":"「<ruby>無理<rt>むり</rt></ruby> const escHTML=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const heroName=()=>(CHAR.name||'').trim()||'田中';
// 物語の中の「田中」を、キャラ作成で付けた名前に差し替える
function swapName(h){
  const n=heroName(); if(n==='田中') return h;
  const html=/[\u4e00-\u9fff々]/.test(n)&&CHAR.yomi?`<ruby>${escHTML(n)}<rt>${escHTML(CHAR.yomi)}</rt></ruby>`:escHTML(n);
  return h.replace(/<ruby>田中<rt>たなか<\/rt><\/ruby>/g,html).replace(/田中/g,escHTML(n)).replace(/Tanaka/g,escHTML(n));
}
const speakName=text=>{ const n=heroName(); return n==='田中'?text:text.replace(/田中/g,CHAR.yomi||n); };
const rb=s=>s==null?'':swapName(RUBY[s]||s);
// 読み上げには、確認ずみのふりがな（かな）を渡す。端末の音声エンジンが漢字を読み違えないように
function speakText(text){
  const h=RUBY[text]; if(!h) return speakName(text);
  const n=heroName();
  return h.replace(/<ruby>田中<rt>たなか<\/rt><\/ruby>/g,n==='田中'?'たなか':(CHAR.yomi||n))
    .replace(/<ruby>[^<]*<rt>([^<]*)<\/rt><\/ruby>/g,'$1').replace(/<[^>]+>/g,'');
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
function hidePanel(){ panel.classList.remove('show'); rerender=null; }
function ask(step,i,n){
  return new Promise(res=>{
    const opts=shuffle(step.opts);
    const draw=()=>{
      panelIn.innerHTML=`<div class="q"><small>Q${i+1} / ${n}・${LR(step.title,step.titleEn)}</small>${LR(step.q,step.qEn)}</div>
        <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${'ABCD'[j]}</span><span>${LR(o.t,o.tEn)}</span></button>`).join('')}</div>`;
      panelIn.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ hidePanel(); res(opts[+b.dataset.j]); });
    };
    draw(); rerender=draw; panel.classList.add('show');
  });
}
function result(step,choice){
  return new Promise(res=>{
    const good=step.opts.find(o=>o.ok);
    const draw=()=>{
      panelIn.innerHTML=`<div class="res ${choice.ok?'ok':'ng'}"><h3>${t(choice.ok?'good':'bad')}</h3>
        ${choice.ok?'':`<div class="model">${t('answer')}${LR(good.t,good.tEn)}</div>`}
        <p>${LR(choice.why,choice.whyEn)}${choice.ok?'':'<br><br>'+LR(good.why,good.whyEn)}</p>
        <button class="btn" id="nextBtn">${t(choice.ok?'next':'nextModel')}</button></div>`;
      nextBtn.onclick=()=>{ hidePanel(); res(); };
    };
    draw(); rerender=draw; panel.classList.add('show'); nextBtn.focus();
  });
}
const stateOf=(ch,st)=>({...(ch.base||{}),...st.state});
// 進行中の話を止めて、画面をまっさらにする
function abortPlay(){
  GEN++; TW=[]; skipper=null; SPEAKER=null; for(const k in ACTORS) ACTORS[k].talking=false;
  for(const el of [...tags.keys()]) untag(el);
  try{ speechSynthesis.cancel(); }catch(e){}
  hintEl.style.opacity=0; captionEl.style.opacity=0; banner.style.opacity=0;
  hidePanel(); setPip(null); pauseBtn.hidden=true;
}
function pauseMenu(){
  const back=rerender;
  try{ speechSynthesis.pause(); }catch(e){}
  const draw=()=>{
    screenEl.innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">${chapLabel(CH)} ${LR(CH.title,CH.titleEn)}</div>
      <h1>${t('paused')}</h1><div class="stack"><button class="btn" id="pResume">${t('resume')}</button>
      <button class="btn ghost" id="pRestart">${t('restart')}</button><button class="btn ghost" id="pHome">${t('home')}</button></div>
      <p class="small" style="margin-top:12px">${t('pauseNote')}</p></div>`;
    pResume.onclick=()=>{ screenEl.hidden=true; rerender=back; try{ speechSynthesis.resume(); }catch(e){} };
    pRestart.onclick=()=>play(CH);
    pHome.onclick=()=>title();
  };
  screenEl.hidden=false; draw(); rerender=draw; pResume.focus();
}
async function play(ch){
  abortPlay(); SPIN=false; resize(); pauseBtn.hidden=false; screenEl.className='screen';
  if(ch.look) wearLook(ch.look);
  CH=ch; MAD=0; HAPPY=0; setScore(50); log=[]; screenEl.hidden=true; rerender=null; setSign(...ch.sign);
  stepPill.innerHTML=`${chapLabel(ch)} ${LR(ch.title,ch.titleEn)}`;
  await ch.prelude();
  const n=ch.steps.length;
  for(let i=0;i<n;i++){
    const st=ch.steps[i]; stepPill.textContent=`${chapLabel(ch)}  Q${i+1}/${n}`;
    applyState(stateOf(ch,st)); await camTo(st.cam,700);
    const c=await ask(st,i,n);
    await c.act();
    const who=st.npc&&st.npc.visible?st.npc:(ch.hero||P);
    if(c.ok){ emote(who,'😊'); setScore(score+5);
      const lv=[65,80,95].filter(v=>score>=v).length;
      if(lv>HAPPY&&MAD===0&&ch.praise&&st.npc&&st.npc.visible){ HAPPY=lv; await wait(300); await cheer(st.npc); await say(st.npc,ch.praise[lv-1]); } }
    else { if(c.silly) MAD++; emote(who,st.npc?'😓':'💦'); setScore(score-(c.silly?10:5)); if(c.react&&st.npc) await say(st.npc,c.react); if(c.silly&&ch.rage&&st.npc&&st.npc.visible) await fume(st.npc); }
    log.push(st);
    st._ok=c.ok;
    await wait(500);
    await result(st,c);
    if(score<=0){ finishZero(await zeroEvent(ch,st)); return; }
    if(!c.ok){ applyState(stateOf(ch,st)); await camTo(st.cam,300); banner.innerHTML=t('model'); banner.style.opacity=1; await st.opts.find(o=>o.ok).act(); banner.style.opacity=0; await wait(300);
      if(c.silly&&ch.rageAfter&&st.npc&&st.npc.visible){ emote(st.npc,'😤'); await say(st.npc,ch.rageAfter[Math.min(MAD,ch.rageAfter.length)-1]); } }
    if(st.after) await st.after();
  }
  finish();
}

function bossBeside(h){
  if(Y.visible) return Y;
  const ry=h.rotation.y, x=h.position.x+Math.cos(ry)*0.85, z=h.position.z-Math.sin(ry)*0.85;
  pose(Y,{x,z,ry}); return Y;
}
async function faint(h){ emote(h,'😱'); await wait(500); await all(tw(h.rotation,'x',-1.45,700),tw(h.u.armL.rotation,'z',1.2,700),tw(h.u.armR.rotation,'z',-1.2,700)); await wait(600); }

    await caption('── 翌日、取引停止の連絡が来た ──',"── The next day, the client ended the deal ──",2400); return ['取引停止','Deal cancelled'];
  }
  if(k===1){
    if(job){ if(n) await say(n,'…大学のキャリアセンターに、連絡させていただきますね。'); emote(h,'😱'); await wait(600);
      await caption('── 後日、キャリアセンターに呼び出された ──',"── Later, the career center called you in ──",2400); return ['キャリアセンター行き','Called in by the career center']; }
    const b=bossBeside(h); await face(b,h);
    await say(b,'田中ァ！！ちょっと会議室に来い！！',['山田部長','Manager Yamada']); emote(h,'😱'); await wait(700);

  }

    await caption('「最高大学の田中には気をつけろ」',"“Watch out for Tanaka from Saikō University.”",2400); await faint(h); return ['業界のウワサ','The talk of the industry']; }

const RANKS='SABC';
function finish(){
  setPip(null); pauseBtn.hidden=true;
  const n=log.filter(l=>l._ok).length;
  const r=score>=90?'S':score>=70?'A':score>=50?'B':'C';
  if(!BEST[CH.id]||RANKS.indexOf(r)<RANKS.indexOf(BEST[CH.id])){ BEST[CH.id]=r; saveBest(); }
  const next=CHAPTERS[CHAPTERS.indexOf(CH)+1];
  const draw=()=>{
    screenEl.innerHTML=`<div class="card" style="text-align:center">
      <div class="eyebrow">${chapLabel(CH)} ${LR(CH.title,CH.titleEn)} ${t('cleared')}</div>
      <div class="rank">${r}</div><h1>${t('r'+r)}</h1>
      <p>${t('impression')} ${score} / 100 ・ ${t('correct')} ${n} / ${CH.steps.length}</p>
      <ul class="log" style="text-align:left">${log.map(l=>`<li><span>${l._ok?'⭕':'❌'}</span><span>${LR(l.title,l.titleEn)}</span></li>`).join('')}</ul>
      <div class="stack">${next?`<button class="btn" id="nextCh">→ ${chapLabel(next)} ${LR(next.title,next.titleEn)}</button>`:''}
        <button class="btn ${next?'ghost':''}" id="again">${t('again')}</button><button class="btn ghost" id="toTitle">${t('toTitle')}</button></div></div>`;
    if(next) nextCh.onclick=()=>play(next);
    again.onclick=()=>play(CH); toTitle.onclick=()=>title();
  };
  screenEl.hidden=false; draw(); rerender=draw;
}

    if(s.ex) h+=`<div class="exlist">${s.ex.map(([a,b,c])=>`<div><small>${LR(a,b)}</small><span>${rb(c)}</span><button class="say" data-say="${c}" aria-label="読み上げ">🔊</button></div>`).join('')}</div>`;
    if(s.pats) h+=`<div class="pats">${s.pats.map(([k,p,e])=>`<div class="t-${k}"><span class="badge t-${k}">${rb(TYPES[k].ja)}</span><b>${rb(p)}</b><span>${rb(e)}</span></div>`).join('')}</div>`;
    if(s.mis) h+=`<div class="mis">${s.mis.map(([x,o,j,e])=>`<div><span class="x">✗ ${rb(x)}</span><span class="o">→ ${rb(o)}</span><small>${LR(j,e)}</small></div>`).join('')}</div>`;
    if(s.names) h+=`<table class="names"><thead><tr><th></th><th>${LR('相手側',"Their side")}</th><th>${LR('自分側',"Your side")}</th></tr></thead><tbody>${s.names.map(([a,e,b,c])=>`<tr><th>${rb(a)}<small>${e}</small></th><td>${rb(b)}</td><td>${rb(c)}</td></tr>`).join('')}</tbody></table>`;
    return h+'</section>';
  };
  const draw=()=>{ shell('basics',BASICS.map(sec).join(''),true); };
  draw(); rerender=draw;
}

/* ---------- 単語帳 ---------- */
let wordFilter='', openWords=new Set();
function words(){
  const draw=()=>{
    shell('words',`<p class="small">${t('tapOpen')}</p><input class="search" id="wq" placeholder="${UI.search[LANG==='en'?1:0]}" value="${wordFilter.replace(/"/g,'')}"><div id="wlist"></div>`,true);
    const list=()=>{
      const f=wordFilter.trim().toLowerCase();
      const vs=VERBS.filter(v=>!f||[v.base,v.en,...v.son,...v.ken,...v.tei].some(s=>s.toLowerCase().includes(f)));
      wlist.innerHTML=vs.map(v=>`<div class="vrow ${openWords.has(v.base)?'open':''}" data-b="${v.base}"><button class="vh"><span class="base">${rb(v.base)}</span><span class="mean">${v.en}</span><span class="chev">›</span></button>
        <div class="vbody">${['son','ken','tei'].map(k=>`<div class="vcell t-${k}"><span class="lab">${rb(TYPES[k].ja)}<small>${TYPES[k].en}</small></span>
          <span class="words">${v[k].map(x=>`<button class="word" data-say="${x}">${rb(x)} <i>🔊</i></button>`).join('')}</span></div>`).join('')}
          ${v.note?`<p class="note">💡 ${LR(v.note,v.noteEn)}</p>`:''}</div></div>`).join('')||`<p class="small">${t('notFound')}</p>`;
      wlist.querySelectorAll('.vh').forEach(b=>b.onclick=()=>{ const r=b.parentElement; r.classList.toggle('open'); r.classList.contains('open')?openWords.add(r.dataset.b):openWords.delete(r.dataset.b); });
    };
    list(); wq.oninput=e=>{ wordFilter=e.target.value; list(); };
  };
  draw(); rerender=draw;
}

/* ---------- 練習（言い換え4択） ---------- */
let PQ=null, pStat={ok:0,n:0};
function newPracticeQ(){
  const v=pick(VERBS), k=pick(['son','ken','son','ken','tei']);
  const ans=pick(v[k]);
  const others=['son','ken','tei'].filter(x=>x!==k).map(x=>v[x][0]);
  const extra=k==='tei'?v.base:pick(VERBS.filter(o=>o!==v).flatMap(o=>o[k]).filter(x=>!v[k].includes(x)));
  PQ={v,k,ans,opts:shuffle([...new Set([ans,...others,extra])]),picked:null};
}
function practice(){
  if(!PQ) newPracticeQ();
  const draw=()=>{
    const {v,k,opts,picked}=PQ, done=picked!=null, right=done&&v[k].includes(picked);
    shell('practice',`<p class="small">${t('pIntro')}　${t('pScore')} ${pStat.ok} / ${pStat.n}</p>
      <div class="pq"><span class="big">${rb(v.base)}</span><span class="mean">${v.en}</span>
        <div class="pto">${LANG==='en'?t('pPrompt')+' ':''}<span class="badge t-${k}">${rb(TYPES[k].ja)}</span> <small>${TYPES[k].en}</small>${LANG==='en'?'':' '+t('pPrompt')}</div></div>
      <div class="opts">${opts.map((o,j)=>{ let c=''; if(done){ if(v[k].includes(o)) c='sel-ok'; else if(o===picked) c='sel-ng'; else c='dim'; }
        return `<button class="opt ${c}" data-j="${j}" ${done?'disabled':''}><span class="k">${'ABCD'[j]}</span><span>${rb(o)}</span></button>`; }).join('')}</div>
      ${done?`<div class="pres ${right?'ok':'ng'}"><b>${t(right?'pRight':'pWrong')}</b>
        ${['son','ken','tei'].map(x=>`<div><span class="badge t-${x}">${rb(TYPES[x].ja)}</span> ${v[x].map(rb).join('、')}</div>`).join('')}
        ${v.note?`<div class="note">💡 ${LR(v.note,v.noteEn)}</div>`:''}
        <button class="btn" id="pNext">${t('pNext')}</button></div>`:''}`,true);
    screenEl.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>{ PQ.picked=opts[+b.dataset.j]; pStat.n++; if(v[k].includes(PQ.picked)) pStat.ok++; tts(speakText(PQ.ans),1); draw(); });
    if(done){ pNext.onclick=()=>{ newPracticeQ(); draw(); }; pNext.focus(); }
  };
  draw(); rerender=draw;
}
function charView(then){
  if(!SPIN){ abortPlay(); applyState({P:{x:0,z:2.4,ry:0.3}}); SPIN=true; }
  const saveChar=()=>{ store.set('skw-char',JSON.stringify(CHAR)); };
  const draw=()=>{
    const sw=(key,list,color)=>list.map((v,i)=>`<span class="swl"><button class="sw" data-k="${key}" data-i="${i}" aria-pressed="${CHAR[key]===i}" aria-label="${escHTML(L(v[0],v[1]))}" style="background:${color(v,i)}"></button>${v[0]?LR(v[0],v[1]):''}</span>`).join('');
    const keep=screenEl.querySelector('.card')?.scrollTop||0;
    shell('char',`${then?`<p class="small">${t('cFirst')}</p>`:''}<h1>${t('cTitle')}</h1><span id="cPrevSlot"></span>
      <label class="cfield"><span>${t('cName')}</span><input id="cName" maxlength="12" value="${escHTML(CHAR.name)}" autocomplete="off"></label>
      <label class="cfield"><span>${t('cYomi')}</span><input id="cYomi" maxlength="16" value="${escHTML(CHAR.yomi)}" autocomplete="off" lang="ja"></label>
      <div class="cfield"><span>${t('cOutfit')}</span><div class="hairs">${OUTFITS.map(([k,ja,en])=>`<button class="chip" data-outfit="${k}" aria-pressed="${CHAR.outfit===k}">${LR(ja,en)}</button>`).join('')}</div></div>
      <div class="cfield"><span>${t('cSuit')}</span><div class="swatches">${sw('suit',SUITS,v=>v[2])}</div></div>
      <div class="cfield"><span>${t('cHair')}</span><div class="hairs">${HAIRS.map(([k,ja,en])=>`<button class="chip" data-hair="${k}" aria-pressed="${CHAR.hair===k}">${LR(ja,en)}</button>`).join('')}</div></div>
      <div class="cfield"><span>${t('cHairColor')}</span><div class="swatches">${sw('hairColor',HAIRCOLORS,v=>v[2])}</div></div>
      <div class="cfield"><span>${t('cVoice')}</span><div class="hairs">${VOICES_UI.map(([k,ja,en])=>`<button class="chip" data-voice="${k}" aria-pressed="${CHAR.voice===k}">${LR(ja,en)}</button>`).join('')}<button class="chip" id="cTry">${t('cTry')}</button></div></div>
      <div class="cfield"><span>${t('cEye')}</span><div class="swatches">${sw('eye',EYES,v=>v[2])}</div></div>
      <div class="cfield"><span>${t('cLip')}</span><div class="swatches">${sw('lip',LIPS,(v,i)=>v[2]||mixHex(SKINS[CHAR.skin],'#9c3d3d',0.55))}</div></div>
      <div class="cfield"><span>${t('cSkin')}</span><div class="swatches">${sw('skin',SKINS.map(()=>['','']),(v,i)=>SKINS[i])}</div></div>
      <button class="btn" id="cStart">${then?`${t('cStartCh')}${chapLabel(then)}${t('cStartCh2')}`:t('cStart')}</button>
      <p class="small" style="margin-top:10px">${t('cNote')}</p>`);
    cName.oninput=e=>{ CHAR.name=e.target.value; saveChar(); };
    cYomi.oninput=e=>{ CHAR.yomi=e.target.value; saveChar(); };
    screenEl.querySelectorAll('[data-hair]').forEach(b=>b.onclick=()=>{ CHAR.hair=b.dataset.hair; saveChar(); rebuildHero(); draw(); });
    const trySay=()=>{ pickVoice(); try{ speechSynthesis.cancel(); }catch(e){} tts(speakText('はじめまして。田中と申します。よろしくお願いいたします。'),P.pitch,P.gender,P.pitchMul); };
    screenEl.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>{ CHAR.voice=b.dataset.voice; saveChar(); rebuildHero(); draw(); trySay(); });
    cTry.onclick=trySay;
    screenEl.querySelectorAll('[data-outfit]').forEach(b=>b.onclick=()=>{ CHAR.outfit=b.dataset.outfit; saveChar(); rebuildHero(); draw(); });
    screenEl.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{ CHAR[b.dataset.k]=+b.dataset.i; saveChar(); rebuildHero(); draw(); });
    cStart.onclick=()=>{ saveChar(); SPIN=false; resize(); if(then){ pickVoice(); play(then); } else title(); };
    screenEl.querySelector('#cPrevSlot').replaceWith(prevCanvas);
    screenEl.querySelector('.card').scrollTop=keep;
  };
  draw(); rerender=draw;
}
// キャラ作成のプレビュー：カードの中の枠に、もう一つのレンダラーで主人公だけを写す
const prevCanvas=document.createElement('canvas'); prevCanvas.className='preview'; prevCanvas.setAttribute('aria-hidden','true');
const heroCam=new THREE.PerspectiveCamera(32,1,0.1,60);
let prevR=null;
function renderPreview(){
  if(!prevCanvas.isConnected) return;
  const w=prevCanvas.clientWidth, h=prevCanvas.clientHeight; if(!w||!h) return;
  if(!prevR){ prevR=new THREE.WebGLRenderer({canvas:prevCanvas,antialias:true}); prevR.shadowMap.enabled=true; prevR.shadowMap.type=THREE.PCFSoftShadowMap; }
  prevR.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); prevR.setSize(w,h,false);
  heroCam.aspect=w/h; heroCam.updateProjectionMatrix();
  // 全身（約2.1）が縦に、肩幅（約1.0）が横に収まる距離
  const tan=Math.tan(heroCam.fov*Math.PI/360), d=Math.max(2.45/(2*tan),1.1/(2*tan*heroCam.aspect));
  heroCam.position.set(0,1.05,2.4+d); heroCam.lookAt(0,0.92,2.4);
  prevR.render(scene,heroCam);
}
const VIEWS={sim:title,char:()=>charView(),basics,words,practice};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); try{speechSynthesis.cancel();}catch(_){} tts(speakText(b.dataset.say),1); } });

soundBtn.onclick=()=>{ soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇'; if(!soundOn) try{speechSynthesis.cancel();}catch(e){} };
langBtn.onclick=()=>setLang(LANG==='en'?'ja':'en');
pauseBtn.onclick=()=>pauseMenu();
furiBtn.onclick=()=>setFuri(!FURI);
applyLangUI();
title();
</script>
